server:
  # Render sets PORT; locally it's 8090.
  port: ${PORT:8090}
  # Locally: this machine only (no login). Hosted: SERVER_ADDRESS=0.0.0.0 with AUTH_ENABLED=true.
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: company-wise-prep
  datasource:
    # Neon (Postgres) when DB_URL/DB_USERNAME/DB_PASSWORD are set — run.ps1 loads them from .env.
    # Otherwise a local H2 file, so tests and offline use need nothing installed.
    url: ${DB_URL:jdbc:h2:file:./.local/prep;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # Neon suspends idle compute; keep the pool small and let connections be recycled.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 120000
      max-lifetime: 600000
  web:
    resources:
      # The freshly built UI on disk first (no restart after npm run build), then the packaged copy.
      static-locations: file:./src/main/resources/static/,classpath:/static/
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # The import writes thousands of rows; batch them (matters over the network to Neon).
        jdbc.batch_size: 200
        order_inserts: true

prep:
  # Repo-relative; the app is started from the repo root (in Docker: /app).
  data-dir: ${DATA_DIR:./data}
  auth:
    # Hosted only. The app runs submitted code, so it refuses to start with auth enabled but no
    # strong password/secret (see AuthService).
    enabled: ${AUTH_ENABLED:false}
    password: ${APP_PASSWORD:}
    token-secret: ${APP_TOKEN_SECRET:}
  cors:
    # The Netlify site, e.g. https://company-wise-prep.netlify.app (comma-separated for several).
    allowed-origins: ${CORS_ORIGINS:}
  code-runner:
    # Run / Submit / Playground. Off on a small hosted instance (each test needs its own JVM);
    # problems and the editor still show.
    enabled: ${CODE_RUNNER_ENABLED:true}
  keep-alive:
    # Hosted only (see KeepAlive): the app pings its own public URL so Render's free plan doesn't
    # put it to sleep. Render sets RENDER_EXTERNAL_URL; empty locally, so nothing runs there.
    # To turn it off on Render, add KEEP_ALIVE_URL with an empty value.
    url: ${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
    interval: ${KEEP_ALIVE_INTERVAL:PT10M}
  judge:
    heap: ${JUDGE_HEAP:512m}
    parallel: ${JUDGE_PARALLEL:0}
