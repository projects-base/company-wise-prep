# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: company-wise-prep-api
    runtime: docker
    plan: free                # 512 MB, sleeps after ~15 min idle; the code runner stays local-only
    region: singapore         # same region as the Neon database (ap-southeast-1)
    branch: main
    autoDeploy: true
    buildFilter:              # monorepo: rebuild the API only when backend files change
      paths:
        - src/**
        - data/**
        - pom.xml
        - Dockerfile
        - .mvn/**
    healthCheckPath: /api/auth/status
    envVars:
      - key: DB_URL
        sync: false           # jdbc:postgresql://<neon-host>-pooler.../neondb?sslmode=require&channelBinding=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_PASSWORD
        sync: false           # your login password, 12+ characters
      - key: APP_TOKEN_SECRET
        generateValue: true   # signs login tokens; Render generates a random one
      - key: CORS_ORIGINS
        sync: false           # your Netlify URL, e.g. https://company-wise-prep.netlify.app
      - key: AUTH_ENABLED
        value: "true"
      - key: CODE_RUNNER_ENABLED
        value: "false"        # Run/Submit/Playground need a JVM per test — use the local app for coding.
                              # On a 2 GB plan set this to "true" and add JUDGE_HEAP=384m, JUDGE_PARALLEL=2.
