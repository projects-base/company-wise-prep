method: checkInclusion
tests:
- name: Example 1
  input: |
    "ab"
    "eidbaooo"
  expected: |
    true
- name: Example 2
  input: |
    "ab"
    "eidboaoo"
  expected: |
    false
- name: s1 longer than s2
  hidden: true
  input: |
    "abc"
    "ab"
  expected: |
    false
- name: Equal strings
  hidden: true
  input: |
    "abc"
    "cba"
  expected: |
    true
- name: Match at the very end
  hidden: true
  input: |
    "xyz"
    "aaaaazyx"
  expected: |
    true
- name: Repeated letters
  hidden: true
  input: |
    "aab"
    "abab"
  expected: |
    true
- name: Counts must match
  hidden: true
  input: |
    "aabc"
    "abcbca"
  expected: |
    false
- name: 10,000 characters, match near end
  hidden: true
  input: |
    ""
    ""
  expected: |
    true
- name: 10,000 characters, no match
  hidden: true
  input: |
    ""
    ""
  expected: |
    false
