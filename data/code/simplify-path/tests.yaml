method: simplifyPath
tests:
- name: Example 1
  input: |
    "/home/"
  expected: |
    "/home"
- name: Example 2
  input: |
    "/home//foo/"
  expected: |
    "/home/foo"
- name: Example 3
  input: |
    "/a/./b/../../c/"
  expected: |
    "/c"
- name: Above the root
  hidden: true
  input: |
    "/../"
  expected: |
    "/"
- name: Triple dots are a name
  hidden: true
  input: |
    "/.../a/../b/c/../d/./"
  expected: |
    "/.../b/d"
- name: Just the root
  hidden: true
  input: |
    "/"
  expected: |
    "/"
- name: Names that start with dots
  hidden: true
  input: |
    "/..hidden/.config//..//x_1/...."
  expected: |
    "/..hidden/x_1/...."
- name: Many slashes and dots
  hidden: true
  input: |
    "///./././/..//usr///local/../bin/"
  expected: |
    "/usr/bin"
- name: Long random path (3000 chars)
