method: simplify
tests:
- name: Example 1
  input: |
    "a+b+a+c-b-b-b+(d+c)"
  expected: |
    "2a-2b+2c+d"
- name: Example 2
  input: |
    "x-(y-x)"
  expected: |
    "2x-y"
- name: Example 3
  input: |
    "a-a+(b-b)"
  expected: |
    "0"
- name: Single variable
  hidden: true
  input: |
    "z"
  expected: |
    "z"
- name: Leading minus
  hidden: true
  input: |
    "-a"
  expected: |
    "-a"
- name: Negated term inside negated group
  hidden: true
  input: |
    "a-(-b+c)-b"
  expected: |
    "a-c"
- name: Group at the start
  hidden: true
  input: |
    "(c+b)+a"
  expected: |
    "a+b+c"
- name: Coefficients above 9 and below -9
  hidden: true
  input: |
    "-a-a-a-a-a-a-a-a-a-a-a-a+b+b+b+b+b+b+b+b+b+b+b+b"
  expected: |
    "-12a+12b"
