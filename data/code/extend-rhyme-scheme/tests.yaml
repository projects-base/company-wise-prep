method: extendScheme
tests:
- name: Example 1
  input: |
    "ABA"
    "CDCEED"
  expected: |
    "ABACCB"
- name: Example 2
  input: |
    "AAB"
    "ABCD"
  expected: |
    ""
- name: Example 3
  input: |
    "B"
    "AABCA"
  expected: |
    "BBACB"
- name: Same length, equivalent
  hidden: true
  input: |
    "XYYX"
    "ABBA"
  expected: |
    "XYYX"
- name: Same length, not equivalent
  hidden: true
  input: |
    "ABCA"
    "ABCD"
  expected: |
    ""
- name: Two short letters for one long letter
  hidden: true
  input: |
    "AB"
    "CCD"
  expected: |
    ""
- name: All 26 letters
  hidden: true
  input: |
    "Z"
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  expected: |
    "ZABCDEFGHIJKLMNOPQRSTUVWXY"
- name: Extend a 50-letter prefix to 40,000
  hidden: true
  input: |
    "VACEWWBZQDGYNOKTETIADFWHWUSWLKCRRGWRXETWAVJDJXBAKF"
    ""
  expected: |
    ""
- name: Mismatch at the last overlapping letter
  hidden: true
  input: |
    ""
    ""
  expected: |
    ""
