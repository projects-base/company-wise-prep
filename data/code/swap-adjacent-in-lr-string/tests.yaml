method: canTransform
tests:
- name: Example 1
  input: |
    "RXXLRXRXL"
    "XRLXXRRLX"
  expected: |
    true
- name: Example 2
  input: |
    "X"
    "L"
  expected: |
    false
- name: Example 3
  input: |
    "XXRXXLXXXX"
    "XXXXRXXLXX"
  expected: |
    false
- name: Identical strings
  hidden: true
  input: |
    "LXR"
    "LXR"
  expected: |
    true
- name: R and L would have to cross
  hidden: true
  input: |
    "RL"
    "LR"
  expected: |
    false
- name: L moves right (illegal)
  hidden: true
  input: |
    "LX"
    "XL"
  expected: |
    false
- name: Counts of X differ
  hidden: true
  input: |
    "XXRX"
    "XRXR"
  expected: |
    false
- name: R steps right up to an L
  hidden: true
  input: |
    "RXL"
    "XRL"
  expected: |
    true
- name: 10,000 cells, reachable
  hidden: true
  input: |
    ""
    ""
  expected: |
    true
- name: 10,000 cells, one L pushed the wrong way
  hidden: true
  input: |
    ""
    ""
  expected: |
    false
