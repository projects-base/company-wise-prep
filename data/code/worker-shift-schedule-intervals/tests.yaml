method: schedule
tests:
- name: Example 1
  input: |
    ["Abby","Ben","Carla","Dan"]
    [[10,100],[50,70],[60,120],[150,300]]
  expected: |
    [[10,50,["Abby"]],[50,60,["Abby","Ben"]],[60,70,["Abby","Ben","Carla"]],[70,100,["Abby","Carla"]],[100,120,["Carla"]],[150,300,["Dan"]]]
- name: Example 2
  input: |
    ["Ann","Ann","Bo"]
    [[0,5],[5,9],[3,7]]
  expected: |
    [[0,3,["Ann"]],[3,7,["Ann","Bo"]],[7,9,["Ann"]]]
- name: Example 3
  input: |
    ["Zoe"]
    [[1,2]]
  expected: |
    [[1,2,["Zoe"]]]
- name: Hand-over at the same moment
  hidden: true
  input: |
    ["A","B"]
    [[0,10],[10,20]]
  expected: |
    [[0,10,["A"]],[10,20,["B"]]]
- name: Identical shifts for two workers
  hidden: true
  input: |
    ["Kim","Lee"]
    [[5,8],[5,8]]
  expected: |
    [[5,8,["Kim","Lee"]]]
- name: Same worker, overlapping shifts
  hidden: true
  input: |
    ["Max","Max","Max"]
    [[0,10],[2,4],[8,15]]
  expected: |
    [[0,15,["Max"]]]
- name: Gap with nobody on duty
  hidden: true
  input: |
    ["P","Q"]
    [[0,3],[7,9]]
  expected: |
    [[0,3,["P"]],[7,9,["Q"]]]
- name: Nested shifts, names given out of order
  hidden: true
  input: |
    ["Zed","amy","Bob"]
    [[0,100],[10,20],[30,40]]
  expected: |
    [[0,10,["Zed"]],[10,20,["Zed","amy"]],[20,30,["Zed"]],[30,40,["Bob","Zed"]],[40,100,["Zed"]]]
