method: characterReplacement
tests:
- name: Example 1
  input: |
    "ABAB"
    2
  expected: |
    4
- name: Example 2
  input: |
    "AABABBA"
    1
  expected: |
    4
- name: k = 0
  hidden: true
  input: |
    "AABBBCC"
    0
  expected: |
    3
- name: Single character
  hidden: true
  input: |
    "Z"
    1
  expected: |
    1
- name: k covers everything
  hidden: true
  input: |
    "ABCDE"
    5
  expected: |
    5
- name: All same
  hidden: true
  input: |
    "QQQQ"
    2
  expected: |
    4
- name: 100,000 characters
  hidden: true
  input: |
    ""
    500
  expected: |
    668
- name: 100,000 characters, k = 0
  hidden: true
  input: |
    ""
    0
  expected: |
    15
