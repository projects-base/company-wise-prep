method: longestSubstring
tests:
- name: Example 1
  input: |
    "aaabb"
    3
  expected: |
    3
- name: Example 2
  input: |
    "ababbc"
    2
  expected: |
    5
- name: k = 1 takes the whole string
  hidden: true
  input: |
    "abcdefg"
    1
  expected: |
    7
- name: k larger than the string
  hidden: true
  input: |
    "aaaa"
    5
  expected: |
    0
- name: No valid substring
  hidden: true
  input: |
    "abcabc"
    3
  expected: |
    0
- name: Answer in the middle
  hidden: true
  input: |
    "xaabbbaay"
    2
  expected: |
    7
- name: 100,000 letters, skewed letter frequencies, k = 60
  hidden: true
  input: |
    ""
    60
  expected: |
    2633
- name: 100,000 letters, rare separators, k = 20
  hidden: true
  input: |
    ""
    20
  expected: |
    96400
- name: 100,000 letters of a/b runs, k = 2000
  hidden: true
  input: |
    ""
    2000
  expected: |
    100000
