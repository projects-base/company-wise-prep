method: addStrings
tests:
- name: Example 1
  input: |
    "11"
    "123"
  expected: |
    "134"
- name: Example 2
  input: |
    "456"
    "77"
  expected: |
    "533"
- name: Example 3
  input: |
    "0"
    "0"
  expected: |
    "0"
- name: Carry chain
  hidden: true
  input: |
    "9999"
    "1"
  expected: |
    "10000"
- name: One zero
  hidden: true
  input: |
    "0"
    "12345"
  expected: |
    "12345"
- name: Final carry
  hidden: true
  input: |
    "5"
    "5"
  expected: |
    "10"
- name: Different lengths
  hidden: true
  input: |
    "1"
    "99999999999999999999999999999"
  expected: |
    "100000000000000000000000000000"
- name: 10,000 digits each
  hidden: true
  input: |
    ""
    ""
  expected: |
    ""
- name: 10,000 nines plus one
  hidden: true
  input: |
    ""
    "1"
  expected: |
    ""
