method: longestPalindrome
tests:
- name: Example 1
  input: |
    "babad"
  expected: |
    3
- name: Example 2
  input: |
    "cbbd"
  expected: |
    2
- name: Single character
  hidden: true
  input: |
    "a"
  expected: |
    1
- name: No repeat
  hidden: true
  input: |
    "abcde"
  expected: |
    1
- name: Whole string
  hidden: true
  input: |
    "racecar"
  expected: |
    7
- name: Even palindrome at the end
  hidden: true
  input: |
    "xyzabba"
  expected: |
    4
- name: Digits and letters
  hidden: true
  input: |
    "1a2b2a1c"
  expected: |
    7
- name: 3000 identical characters
  hidden: true
  input: |
    ""
  expected: |
    3000
- name: 3000 random a/b characters
  hidden: true
  input: |
    ""
  expected: |
    25
