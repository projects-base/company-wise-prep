method: longestSubstring
tests:
- name: Example 1
  input: |
    "dcbabcd"
  expected: |
    6
- name: Example 2
  input: |
    "zyxa"
  expected: |
    0
- name: Example 3
  input: |
    "bcaab"
  expected: |
    3
- name: Single character
  hidden: true
  input: |
    "a"
  expected: |
    0
- name: All the same letter
  hidden: true
  input: |
    "kkkkkk"
  expected: |
    0
- name: Whole string qualifies
  hidden: true
  input: |
    "abcz"
  expected: |
    4
- name: Non-increasing 100,000 chars
  hidden: true
  input: |
    ""
  expected: |
    0
- name: Answer only at the very end
  hidden: true
  input: |
    ""
  expected: |
    2
- name: 100,000 random x/y/z
  hidden: true
  input: |
    ""
  expected: |
    99999
