method: redact
tests:
- name: Example 1
  input: |
    "The cat sat on the mat."
    ["cat","mat"]
  expected: |
    "The REDACTED sat on the REDACTED."
- name: Example 2
  input: |
    "Classic CAT-cat; cats!"
    ["cat"]
  expected: |
    "Classic REDACTED-REDACTED; cats!"
- name: Example 3
  input: |
    "nothing to hide"
    []
  expected: |
    "nothing to hide"
- name: Empty text
  hidden: true
  input: |
    ""
    ["a"]
  expected: |
    ""
- name: Digits are word characters
  hidden: true
  input: |
    "route 66 and 66b; x66"
    ["66"]
  expected: |
    "route REDACTED and 66b; x66"
- name: Apostrophes and newlines split words
  hidden: true
  input: |
    "Don't\nstop: DON don\n"
    ["don","t"]
  expected: |
    "REDACTED'REDACTED\nstop: REDACTED REDACTED\n"
- name: Banned word given in caps
  hidden: true
  input: |
    "Spam spam SPAM spammy"
    ["SPAM"]
  expected: |
    "REDACTED REDACTED REDACTED spammy"
- name: Quotes and backslashes are kept
  hidden: true
  input: |
    "say \"bad\" \\bad\\ now"
    ["bad"]
  expected: |
    "say \"REDACTED\" \\REDACTED\\ now"
