method: lengthOfLongestSubstring
tests:
- name: Example 1
  input: |
    "abcabcbb"
  expected: |
    3
- name: Example 2
  input: |
    "bbbbb"
  expected: |
    1
- name: Example 3
  input: |
    "pwwkew"
  expected: |
    3
- name: Empty string
  hidden: true
  input: |
    ""
  expected: |
    0
- name: Single space
  hidden: true
  input: |
    " "
  expected: |
    1
- name: Repeat jumps left pointer back
  hidden: true
  input: |
    "abba"
  expected: |
    2
- name: Symbols and digits
  hidden: true
  input: |
    "a1!b2@c3#a"
  expected: |
    9
- name: 50,000 characters
  hidden: true
  input: |
    ""
  expected: |
    25
- name: All distinct printable characters
  hidden: true
  input: |
    "!#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijklmnopqrstuvwxyz{|}~"
  expected: |
    92
