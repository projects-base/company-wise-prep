method: minWindow
tests:
- name: Example 1
  input: |
    "ADOBECODEBANC"
    "ABC"
  expected: |
    "BANC"
- name: Example 2
  input: |
    "a"
    "a"
  expected: |
    "a"
- name: Example 3
  input: |
    "a"
    "aa"
  expected: |
    ""
- name: Case matters
  hidden: true
  input: |
    "aAbBcC"
    "ABC"
  expected: |
    "AbBcC"
- name: t longer than s
  hidden: true
  input: |
    "ab"
    "abc"
  expected: |
    ""
- name: Ties go to the leftmost window
  hidden: true
  input: |
    "xabyba"
    "ab"
  expected: |
    "ab"
- name: Repeated letters in t
  hidden: true
  input: |
    "aaflslflsldkalskaaa"
    "aaa"
  expected: |
    "aaa"
- name: Random 300
  hidden: true
  input: |
    ""
    "EEeEEEeB"
  expected: |
    "BDAcAAAddcEecDbeEEAcEccDbeE"
- name: 100,000 characters
  hidden: true
  input: |
    ""
    "zzzqqqjjjxxkkv"
  expected: |
    "vkcxfaccbqizqschjkujpzsqjzx"
- name: 60,000 characters, t is the whole alphabet twice
  hidden: true
  input: |
    ""
    "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz"
  expected: |
    "xjwmqibcioabuahtzvikhieovvmhnfrdtpimmlzjvdybrytqegimmgxupclkcshwnsf"
