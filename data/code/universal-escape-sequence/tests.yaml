method: escapeSequence
tests:
- name: Example 1
  input: |
    ["E.",".."]
  expected: |
    true
- name: Example 2
  input: |
    ["E#",".."]
  expected: |
    true
- name: Example 3
  input: |
    ["E#.","##."]
  expected: |
    true
- name: Only the exit
  hidden: true
  input: |
    ["E"]
  expected: |
    true
- name: Exit in the middle of a ring
  hidden: true
  input: |
    ["#####","#...#","#.E.#","#...#","#####"]
  expected: |
    true
