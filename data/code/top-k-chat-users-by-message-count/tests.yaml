method: topKUsers
tests:
- name: Example 1
  input: |
    [["ann","hi"],["bob","hello"],["ann","how are you"],["cat","yo"],["bob","fine"],["ann","great"]]
    2
  expected: |
    ["ann","bob"]
- name: Example 2
  input: |
    [["zed","a"],["amy","b"],["kim","c"]]
    2
  expected: |
    ["amy","kim"]
- name: Example 3
  input: |
    [["solo","only me"]]
    5
  expected: |
    ["solo"]
- name: k equals the number of users
  hidden: true
  input: |
    [["b","1"],["a","2"],["b","3"]]
    2
  expected: |
    ["b","a"]
- name: Ties at the cut-off
  hidden: true
  input: |
    [["d","1"],["c","1"],["b","1"],["a","1"],["e","1"],["e","2"]]
    3
  expected: |
    ["e","a","b"]
- name: Names compared as strings (u10 before u9)
  hidden: true
  input: |
    [["u9","x"],["u10","x"],["u100","x"]]
    3
  expected: |
    ["u10","u100","u9"]
- name: Message text with quotes and commas
  hidden: true
  input: |
    [["x","a, \"b\""],["y","[1,2]"],["y","ok"]]
    1
  expected: |
    ["y"]
