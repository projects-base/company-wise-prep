method: isValid
tests:
- name: Example 1
  input: |
    "()"
  expected: |
    true
- name: Example 2
  input: |
    "()[]{}"
  expected: |
    true
- name: Example 3
  input: |
    "(]"
  expected: |
    false
- name: Wrong nesting
  hidden: true
  input: |
    "([)]"
  expected: |
    false
- name: Nested
  hidden: true
  input: |
    "{[]}"
  expected: |
    true
- name: Only openers
  hidden: true
  input: |
    "(("
  expected: |
    false
- name: Closer first
  hidden: true
  input: |
    "]"
  expected: |
    false
- name: Extra closer at end
  hidden: true
  input: |
    "()]"
  expected: |
    false
