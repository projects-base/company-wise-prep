slug: cognizant
name: Cognizant (CTS)
aliases: [Cognizant, CTS, Cognizant Technology Solutions]
researched_on: 2026-10-09
domain_notes: >-
  IT services company (consulting and application development for clients across banking,
  insurance, healthcare, retail). Akhil was invited to an in-person weekend hiring drive for
  experienced Java engineers (Java MSB and Java MSB + React Full Stack, 6+ years). Cognizant's
  own "How we hire" page describes: apply, a short recruiter intro call, interviews with the
  hiring team (some roles add technical assessments and/or client interviews), then a decision.
  Current Java full-stack postings ask for Java 8+, Spring Boot, microservices, REST APIs and
  React.js, often with SQL/PL-SQL and cloud (AWS/Azure/GCP). Candidate reports (Glassdoor,
  GeeksforGeeks, Naukri Code360) describe service-company style interviews: mostly theory on
  core Java, collections, Java 8 streams with a small stream coding task, Spring Boot,
  Hibernate/JPA, microservices patterns, SQL basics and a project walk-through; little or no
  LeetCode-style DSA. React rounds ask hooks, lifecycle with useEffect, JS closures/hoisting and
  a small React or JS coding task.
values:
  - name: Work as one (rely on colleagues' strengths, succeed as a team)
    source: https://careers.cognizant.com/india-en/life-at-cognizant/our-culture/
  - name: Raise the bar (high standards in how work is done and what is delivered)
    source: https://careers.cognizant.com/india-en/life-at-cognizant/our-culture/
  - name: Dare to innovate (push boundaries, take calculated risks)
    source: https://careers.cognizant.com/india-en/life-at-cognizant/our-culture/
  - name: Do the right thing (honesty, ethical choices)
    source: https://careers.cognizant.com/india-en/life-at-cognizant/our-culture/
  - name: Own it (take responsibility for outcomes)
    source: https://careers.cognizant.com/india-en/life-at-cognizant/our-culture/

roles:
  - role: Java MSB + React, Full Stack (Java + Microservices + Spring Boot + React)
    level: 6+ years (invite eligibility criteria)
    loop:
      - round: In-person hiring drive (Sat 10 Oct 2026, 9:30 AM - 1 PM, Hyderabad Kokapet or Chennai)
        type: JAVA
        duration_min: 210
        assesses: >-
          Skill groups on the invite: "Java MSB" (6+ years) and "Java MSB + React (FullStack)" (6+
          years). The invite says the whole process takes at least 3-4 hours; it does not list the
          rounds. Documents asked for: latest resume, original government ID, latest
          compensation/increment letter.
          Akhil is interviewing for the Full Stack (Java MSB + React) group.
        focus_areas: [Java, Microservices, Spring Boot, React]
        confidence: verified
        source: interview invite relayed by Akhil, 2026-10-09
        seen_on: 2026-10
      - round: Technical round 1 (reported, weekend interviews, Pune)
        type: JAVA
        assesses: >-
          General questions on Java, Spring Boot, microservices, Kafka and databases. The same
          report lists a technical-manager round and an HR round after it, held on weekends, and
          says no response came after clearing them.
        confidence: claimed
        source: https://clear.glassdoor.nl/Interview/Cognizant-Interview-E8014-RVW102631130.htm
        seen_on: 2025-12
      - round: Technical round (reported, Java Spring Boot Full Stack Developer)
        type: JAVA
        assesses: >-
          Theory-heavy: Java 8 features, OOP, collections (Array vs List, List vs Set, Set vs Map),
          checked vs unchecked exceptions, equals/hashCode, comparators, what microservices are,
          DROP vs DELETE vs TRUNCATE, and one JavaScript question (arrow functions).
        confidence: claimed
        source: https://www.geeksforgeeks.org/cognizant-interview-experience-for-java-spring-boot-full-stack-developer/
        seen_on: 2024-01
      - round: Single long technical interview (reported, ~1.5 h)
        type: JAVA
        duration_min: 90
        assesses: Java, microservices, Spring Boot, Hibernate, plus a Java stream coding problem and cross-questions.
        confidence: claimed
        source: https://static.glassdoor.nl/Interview/Cognizant-Interview-E8014-RVW84676360.htm
        seen_on: 2024-01
      - round: Microservices / Spring depth (reported)
        type: SPRING
        assesses: Saga pattern, circuit breaker, API gateway, Eureka service discovery, core Java and Spring Boot.
        confidence: claimed
        source: https://www.naukri.com/code360/interview-experiences/cognizant/cognizant-interview-experience-by-koushal-goyal-jul-2024-exp-0-2-years
        seen_on: 2024-07
      - round: React / JavaScript technical round (reported, front-end walk-in)
        type: DOMAIN
        assesses: >-
          One technical and one HR round. Basic-to-moderate JavaScript, React.js and Redux Toolkit
          concepts plus coding (first non-repeating character in a string).
        confidence: claimed
        source: https://static.glassdoor.at/Interview/Cognizant-Interview-E8014-RVW97532089.htm
        seen_on: 2025-05
      - round: React technical interview (reported, 45 min)
        type: DOMAIN
        duration_min: 45
        assesses: >-
          Functional vs class components, lifecycle methods with hooks, closures, hoisting,
          var/let/const, a remove-duplicates coding question and a React form with validation.
        confidence: claimed
        source: https://fr.glassdoor.ca/Entretien/Cognizant-Entretien-E8014-RVW75924550.htm
        seen_on: 2025-03
      - round: Technical-manager round (reported)
        type: HIRING_MANAGER
        assesses: Project depth, design decisions, real production issues; follows the technical round on drive days.
        confidence: claimed
        source: https://clear.glassdoor.nl/Interview/Cognizant-Interview-E8014-RVW102631130.htm
        seen_on: 2025-12
      - round: HR round (reported)
        type: BEHAVIORAL
        assesses: >-
          About yourself, current role, why leave, why Cognizant, notice period, location and
          salary expectations.
        confidence: claimed
        source: https://www.geeksforgeeks.org/cognizant-interview-experience-for-java-spring-boot-full-stack-developer/
        seen_on: 2024-01
    bar: >-
      Not known from the invite. Reports suggest a 6+ year hire is expected to answer core Java,
      Spring Boot and microservices theory confidently, write a short Java 8 stream solution by
      hand, and explain their own project's architecture and one production problem in depth; the
      Full Stack group adds React hooks and JavaScript fundamentals. Fill in after the drive.

official:
  hiring_process:
    - step: Apply to the right opportunity
      detail: Find an open role that fits; or join the Talent Community.
      source: https://careers.cognizant.com/india-en/pathways-to-cognizant/how-we-hire/
    - step: Connect with your recruiter
      detail: Short intro call to learn about your experience and fit.
      source: https://careers.cognizant.com/india-en/pathways-to-cognizant/how-we-hire/
    - step: Show off your skills
      detail: Interviews with the hiring team; some roles include technical assessments and/or client interviews.
      source: https://careers.cognizant.com/india-en/pathways-to-cognizant/how-we-hire/
    - step: Decision time
      detail: The team assesses potential to succeed in the role; it "may take some time". Background checks cover education, previous employment and references.
      source: https://careers.cognizant.com/india-en/pathways-to-cognizant/how-we-hire/
  interview_tips:
    - text: Keep the resume current and target roles that match your skills; the page has no interview-specific tips.
      source: https://careers.cognizant.com/india-en/pathways-to-cognizant/how-we-hire/
  job_postings:
