frameworks_to_prepare:
  revise:
    - {name: React hooks and JavaScript fundamentals, why: "core in 4/4 postings and the invite's Full Stack group; React is only 'working' for Akhil", academy: [], plan: "useEffect as lifecycle (deps, cleanup), useMemo/useCallback/useRef/useContext, Redux Toolkit slice; closures, hoisting, event loop; code a fetch-to-table component and a validated form"}
    - {name: Java 8 streams and collections internals, why: "every report; a stream coding task is the most common hands-on question", academy: [A7, H1, B3], plan: "write 8 stream drills by hand (groupingBy, counting, duplicates, second highest, group anagrams); HashMap vs Hashtable vs ConcurrentHashMap"}
    - {name: Spring Boot internals and transactions, why: "core in 4/4 postings", academy: [D4, D3, D6, L4], plan: "auto-configuration, DI and @Autowired resolution, @Transactional propagation/rollback and self-invocation, @ControllerAdvice"}
    - {name: Microservices patterns, why: "core in 4/4 postings; gateway/discovery/circuit breaker/saga asked in reports", academy: [S8, S9], plan: "draw your project with gateway, discovery, config, Resilience4j; explain one saga"}
    - {name: Hibernate / JPA, why: "common: posting + reports", academy: [D6, L7], plan: "entity states, save/persist/merge, N+1 and fetch joins, lazy vs eager"}
    - {name: SQL basics, why: "2/4 postings; DB questions in reports", academy: [Q1, Q2], plan: "DROP/DELETE/TRUNCATE, joins, second highest salary, max per department"}
  learn:
    - {name: Saga and event-driven design, why: "asked in reports; Akhil is basic on event-driven architecture", academy: [S9], plan: "one choreography and one orchestration saga for an order flow, with compensations, on paper"}
    - {name: Cloud deployment basics (AWS), why: "2/4 postings; Akhil is basic on AWS", academy: [], plan: "be able to say how a Spring Boot + React app is deployed: container image, ECS/EKS or Beanstalk, RDS, S3 + CloudFront for the React build"}
    - {name: Kafka basics, why: "mentioned in a 2025 drive report; Akhil is basic", academy: [S9], plan: "topics, partitions, consumer groups, offsets, at-least-once and idempotent consumers"}

