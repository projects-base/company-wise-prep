slug: tower-research
name: Tower Research Capital
aliases: [Tower, TRC, Tower Research]
researched_on: 2026-10-07
domain_notes: >-
  Quantitative / high-frequency trading firm. Core Engineering builds a shared platform (market
  data, execution, risk, compute) that independent trading teams plug into ("hub-and-spoke").
  Tower's own answer on languages: C++ for latency-sensitive systems (market data, execution,
  low-level infra), Python for research and orchestration, Rust increasingly for infra/services
  (https://tower-research.com/ask-tower-anything-questions-and-answers-for-quants-engineers-and-other-prospective-employees/).
  Java does not appear as a requirement in any current Gurugram posting (checked 2026-10-07), but
  Java/Spring backend hires have happened in post-trade (LeetCode reports 2021 and 2025). Interviews
  probe below the framework: OS (virtual memory, page faults, deadlock), networking (TCP vs UDP,
  multicast, congestion control), CPU cache/TLB/RDTSC, and C++ object model even for non-C++ seats.
  Positioning for a Java/Spring engineer: target post-trade / shared-services / platform roles,
  present yourself as a systems engineer who happens to write Java — be ready to talk JVM memory,
  GC pauses, lock-free (CAS, AtomicReference), false sharing, and why a hot path avoids allocation —
  and close the C++/OS/networking gap rather than leaning on Spring Boot experience.
