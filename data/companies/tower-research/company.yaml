roles:
  - role: Senior Software Engineer / SDE-2 (Gurugram; C++ and core engineering)
    level: Software Engineer II-III / L5 (Tower titles; L5 named in a 2021 LeetCode post)
    loop:
      - round: Online test (HackerRank)
        type: DSA
        duration_min: 90
        assesses: >-
          Format varies. 2022 Senior SWE: 7 fix-the-bug C++ tasks + 4 subjective systems questions
          (virtual-memory aliasing, reliable multicast, RDTSC, CPU load path) in 90 min. Another 2022
          Senior SWE (C++) test: 7 fix-the-bug tasks in 60 min. 2021 SDE-2 C++: 7 MCQs (DS/OOP/OS/
          networking) + 2 debugging + 2 coding (one easy, one LeetCode-hard).
        confidence: claimed
        source: https://leetcode.com/discuss/post/1764282/
        seen_on: 2022-02
      - round: Technical 1
        type: DOMAIN
        duration_min: 60
        assesses: TCP vs UDP discussion (~45 min), spotting errors in a C++ snippet, then a trie coding problem; other reports had LFU Cache or Shortest Bridge plus C++ (smart pointers).
        confidence: claimed
        source: https://leetcode.com/discuss/post/1702584/
        seen_on: 2022-01
      - round: Technical 2
        type: LLD
        duration_min: null
        assesses: Deep C++ object model (classes, virtual functions, vtables) then LLD of an HFT system (callbacks, observers). Another SDE-2 report had a multi-threaded buffered queue, a lock-free stack with AtomicReference, and payment idempotency.
        confidence: claimed
        source: https://leetcode.com/discuss/post/1867832/
        seen_on: 2022-03
      - round: Techno-managerial (experienced hires)
        type: HIRING_MANAGER
        duration_min: 60
        assesses: Current work, why change, re-design your project without public cloud, RDBMS depth questions derived from your answers.
        confidence: claimed
        source: https://leetcode.com/discuss/post/1689730/
        seen_on: 2022-01
    bar: >-
      Reports agree that for C++ seats they want deep language and OOP understanding (vtables,
      memory) on top of DSA, plus solid OS and networking. All rounds are reported as elimination
      rounds. Interviewers push on speed ("implement this quickly") and on follow-ups after the
      first working answer. No senior-level (2023–2026) report from Gurugram was found, so the
      senior bar is inferred from 2021–2022 SDE-2 reports.
  - role: SDE 1 (Backend, Post Trade — Java)
    level: Software Engineer I
    loop:
      - round: Online assessment (HackerRank)
        type: DSA
        duration_min: 135
        assesses: 2 coding (Java inheritance template + one medium DSA) and 4 theory questions (OS, DBMS, networking, Java/Python language).
        confidence: claimed
        source: https://leetcode.com/discuss/post/6375258/
        seen_on: 2025-02
      - round: Technical 1
        type: DSA
        duration_min: 60
        assesses: Max Area of Island, then modified to allow filling one row or column.
        confidence: claimed
        source: https://leetcode.com/discuss/post/6375258/
        seen_on: 2025-02
      - round: Technical 2
        type: JAVA
        duration_min: 45
        assesses: Rapid-fire Java/DB internals — ==/equals/hashCode, HashMap internals, String immutability, stack vs heap, connection pooling, Spring Boot connection classes.
        confidence: claimed
        source: https://leetcode.com/discuss/post/6375258/
        seen_on: 2025-02
    bar: >-
      The only Java-track report (candidate rejected after round 2) shows the language round is
      fast and goes deep on internals, not frameworks. HR did not say how many rounds there were.
  - role: Software Engineer (third-party aggregated guides; not Gurugram-specific)
    level: unknown
    loop:
      - round: Online assessment
        type: DSA
        duration_min: 120
        assesses: 2-5 algorithm problems in 90-135 min on HackerRank, sometimes with MCQs on OS/networking/DBMS.
        confidence: claimed
        source: https://www.techprep.app/blog/tower-research-interview-process
        seen_on: "2026"   # undated page; year from its title
      - round: Phone screen(s)
        type: DSA
        duration_min: 60
        assesses: Live coding; standard problem modified mid-solve; C++ and CS fundamentals probing.
        confidence: claimed
        source: https://www.techinterview.org/post/3233476792/how-tower-research-capital-interviews-engineers/
        seen_on: 2026-07
      - round: Super Day
        type: DOMAIN
        duration_min: null
        assesses: 4-6 back-to-back rounds with 2-3 trading teams mixing algorithms, C++ internals, OS/networking, LLD/HLD and past projects.
        confidence: claimed
        source: https://www.techinterview.org/post/3233476792/how-tower-research-capital-interviews-engineers/
        seen_on: 2026-07
      - round: HR / culture fit
        type: BEHAVIORAL
        duration_min: 25
        assesses: Logistics and motivation ("Why Tower?").
        confidence: claimed
        source: https://www.techprep.app/blog/tower-research-interview-process
        seen_on: "2026"   # undated page; year from its title
    bar: >-
      These guides cite no primary sources and describe a mainly US Super Day format. Treat them
      as weak signals. India reports show 2-3 interview rounds after the OA rather than a
      Super Day.

