frameworks_to_prepare:     # vs data/profile.yaml; Tower interviews go below the framework, so most prep is OS / networking / latency
  revise:
    - name: Java concurrency down to CAS and the memory model
      why: "Lock-free stack and buffered-queue questions in reports; profile: java strong"
      academy: [A6, B2, B3, B7]
      plan: "Write a Treiber stack with AtomicReference and explain ABA and happens-before without notes."
    - name: JVM memory, GC and allocation-free hot paths
      why: "Low latency is core; a Java engineer must explain GC pauses and allocation; profile: java strong"
      academy: [A2, A4, A5, A8]
      plan: "Explain TLABs, young-gen pauses and how to keep a hot path allocation-free; measure one with JMH."
    - name: Data structures and LLD for trading (order book, observers)
      why: "LLD of an HFT system with callbacks in reports; profile: gof-design-patterns working"
      academy: [E4, E5]
      plan: "Design an order book: justify the structures for bids and asks and the callback interface for fills."
    - name: RDBMS depth
      why: "Techno-managerial round asked RDBMS depth; profile: sql, postgresql working"
      academy: [Q5, Q6]
      plan: "Explain B-tree index lookups and MVCC visibility in two minutes each."
  learn:
    - name: Linux and OS internals (virtual memory, page faults, TLB, scheduling)
      why: "Core: Linux in 7/7 postings and OS questions in every C++ loop; not in profile (bash basic)"
      academy: []
      plan: "Read the kernel memory-management concepts page and explain what happens on a page fault and on a TLB miss."
      resources: [https://www.kernel.org/doc/html/latest/admin-guide/mm/concepts.html]
    - name: Networking for trading (TCP vs UDP, multicast, kernel bypass)
      why: "Market data is common here; TCP vs UDP took 45 minutes of one round; not in profile"
      academy: []
      plan: "Read udp(7), ip(7) multicast options and tcp(7) Nagle; design reliable multicast with sequence numbers and NACK-based gap recovery."
      resources: [https://man7.org/linux/man-pages/man7/udp.7.html, https://man7.org/linux/man-pages/man7/ip.7.html, https://man7.org/linux/man-pages/man7/tcp.7.html, https://www.kernel.org/doc/html/latest/networking/scaling.html]
    - name: Mechanical sympathy and latency measurement (false sharing, Disruptor, p99)
      why: "Low latency is core; reports ask about CPU caches and RDTSC; Java's answer is the Disruptor and @Contended"
      academy: [A8, B3]
      plan: "Read the LMAX Disruptor overview and JEP 142; explain cache-line padding and why p99.9 matters more than the mean."
      resources: [https://lmax-exchange.github.io/disruptor/, https://openjdk.org/jeps/142]
    - name: C++ object model, enough to discuss
      why: "Core: C++ in 5/7 postings and vtable/smart-pointer questions even in non-C++ loops; not in profile"
      academy: []
      plan: "Learn vtables, move semantics, vector reallocation, RAII and smart pointers, each mapped to its Java equivalent."
      resources: [https://www.learncpp.com/, https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines]
    - name: Python for scripting and data work
      why: "Core: 7/7 postings; profile: python basic"
      academy: []
      plan: "Rewrite one small Java utility in Python and learn NumPy array basics."
      resources: [https://docs.python.org/3/tutorial/index.html, https://numpy.org/doc/stable/user/absolute_beginners.html]
    - name: Rust (required for SE III Shared Services, the best-fit role)
      why: "Common: required in the best-fit posting and growing per the AMA; not in profile"
      academy: []
      plan: "Read the Rust book chapters on ownership and borrowing, then build a small async HTTP service with tokio."
      resources: [https://doc.rust-lang.org/book/, https://tokio.rs/tokio/tutorial]
    - name: Kafka for shared-services work
      why: "Only 2 postings, but cheap and clearly relevant for SE III / PaaS; profile: kafka basic"
      academy: [S9]
      plan: "Learn partitions, consumer groups and ordering guarantees well enough to discuss a trade-event pipeline."
      resources: [https://kafka.apache.org/intro]

