official:
  hiring_process:
    - step: Interview philosophy (no step list published)
      detail: >-
        Tower says it strives for "a straightforward interview and hiring process" with "no gotcha
        questions, random logic problems, or abstract, overly academic discussions" — a thoughtful
        conversation about you, your past roles and what you can achieve. Tower does not publish
        round names, counts or durations; everything about the loop below comes from third parties.
        Note the contradiction: candidate reports describe timed HackerRank OAs, CS-theory MCQs and
        (older, campus/intern) maths puzzles.
      source: https://tower-research.com/careers/
    - step: Applications
      detail: Open roles are listed on tower-research.com/open-positions (Greenhouse board "towerresearchcapital").
      source: https://tower-research.com/careers/
    - step: What Tower says it looks for in candidates
      detail: >-
        Strong fundamentals in probability, statistics, algorithms and coding; people who can
        collaborate, communicate and keep improving under pressure. No single academic path required.
      source: https://tower-research.com/ask-tower-anything-questions-and-answers-for-quants-engineers-and-other-prospective-employees/
