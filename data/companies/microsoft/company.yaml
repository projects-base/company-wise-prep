frameworks_to_prepare:     # vs data/profile.yaml; ordered for an SDE II loop (DSA + LLD + HLD + AA)
  revise:
    - name: Distributed systems and the HLD method
      why: "Core in 12/17 postings; HLD rounds in every loop report; profile: distributed-systems and system-design working"
      academy: [F1, F3, F2, F4, F6]
      plan: "Run the metrics-and-monitoring design (F6) in 45 min, saying two options, the trade-off and your choice at each step."
    - name: Java for the coding rounds, plus concurrency
      why: "Interview language (Java accepted everywhere); Azure AI Search Senior asks for concurrency; profile: java strong"
      academy: [H1, B1, B2, B4, B7, A6]
      plan: "Write a thread-safe bounded queue and a rate limiter in Java with tests, under 30 minutes each."
    - name: Object-oriented design and design patterns (LLD)
      why: "4/17 postings and a standard LLD round; profile: gof-design-patterns working"
      academy: [E1, E4, E5, E6]
      plan: "Do one LLD case from E6 with the AI tool open, and narrate what you accept or reject from it."
    - name: Testing and edge cases
      why: "Microsoft says technical interviews assess writing tests and finding edge cases; profile: testing-junit-mockito strong"
      academy: [H2, D8]
      plan: "End every practice problem by listing 5 edge cases and writing 3 tests before saying 'done'."
    - name: AI-assisted engineering (Copilot, Claude Code, MCP)
      why: "Core in 10/17 postings; AI-assisted LLD rounds reported in 2026; profile: ai-coding-tools working"
      academy: [G2, G4]
      plan: "Prepare a 90-second account of how you prompt, review and verify AI-generated code, with one bug you caught."
    - name: Microservices and resilience patterns
      why: "5/17 postings ask for microservices; CSX names cloud design patterns; profile: microservices-patterns working"
      academy: [S8]
      plan: "Map circuit breaker, retry with backoff and bulkhead from the Azure patterns catalog to your Spring Boot experience."
    - name: Security and identity (OAuth 2.0, JWT)
      why: "8/17 security + 3 identity; profile: spring-security working"
      academy: [D7]
      plan: "Explain the OAuth 2.0 auth-code flow and token validation in a service-to-service call."
    - name: REST API design
      why: "API design and REST in 6/17 postings; profile: rest-api-design strong"
      academy: [D5]
      plan: "Light touch: pagination, idempotency and versioning for one API in your HLD answer."
    - name: SQL and relational modelling
      why: "SQL/NoSQL in 4/17 postings; profile: sql, postgresql working"
      academy: [Q5, Q6]
      plan: "Be ready to say when you would pick Azure SQL over Cosmos DB and why."
  learn:
    - name: Observability and live-site operations (metrics, logs, traces, SLOs, incident response)
      why: "Core: 12/17 observability, 10/17 DRI on-call; HLD follow-ups ask how you detect and debug failures; profile: prometheus-grafana basic, opentelemetry none"
      academy: [D8, F6, H3]
      plan: "Learn the OpenTelemetry signal types and SLO/error-budget basics, then add alerts and a debugging path to every HLD you practise."
      resources: [https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-overview, https://sre.google/sre-book/service-level-objectives/, https://learn.microsoft.com/en-us/kusto/query/]
    - name: LLMs, RAG and agents
      why: "7/17 LLM/GenAI, 5 RAG, 5 agents; not in profile beyond using AI tools"
      academy: [G1, G2, G3, G5]
      plan: "Learn chunking, embeddings, vector search and grounding, then sketch a RAG service with caching and evals."
      resources: [https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview, https://modelcontextprotocol.io/introduction]
    - name: Safe deployment practices (canary, staged rollout, bake time, rollback)
      why: "CI/CD in 7/17 postings and Azure's own safe deployment practice; profile: github-actions basic"
      academy: []
      plan: "Read the WAF safe-deployment page and be able to describe ring-based rollout with health gates and automatic rollback."
      resources: [https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments, https://azure.microsoft.com/en-us/blog/advancing-safe-deployment-practices/]
    - name: High availability, geo-distribution, caching and event-driven patterns
      why: "Each common (3/17); profile: failover-patterns, event-driven-architecture basic"
      academy: [F2, Q8, S9]
      plan: "Learn active-active vs active-passive with RTO/RPO, and when to use a queue vs an event stream; use them in one HLD."
      resources: [https://learn.microsoft.com/en-us/azure/architecture/patterns/, https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker]
    - name: Azure core services as AWS/Spring equivalents
      why: "6/17 postings name Azure services; profile: aws basic, no Azure"
      academy: []
      plan: "Make a one-page map: AKS, Functions, Service Bus vs Event Hubs, Cosmos DB consistency levels, Azure SQL, and their AWS equivalents."
      resources: [https://learn.microsoft.com/en-us/azure/aks/what-is-aks, https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-messaging-overview, https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels]
    - name: C# / .NET for reading team code
      why: "C#/.NET is the main stack in 8/17 postings; you can interview in Java, but say you can pick up C# quickly"
      academy: []
      plan: "Read the C# tour and the ASP.NET Core fundamentals page once; note the Java equivalents (LINQ vs streams, async/await vs CompletableFuture)."
      resources: [https://learn.microsoft.com/en-us/dotnet/csharp/tour-of-csharp/, "https://learn.microsoft.com/en-us/aspnet/core/fundamentals/?view=aspnetcore-9.0"]

