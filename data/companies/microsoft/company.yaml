roles:
  - role: Software Engineer II (SDE II)
    level: "61-62"
    loop:
      - round: Online assessment
        type: DSA
        duration_min: 90
        assesses: >-
          2 problems (sometimes 3) on Codility or HackerRank, usually one medium plus one
          medium-hard/hard (DP, graph, binary search). Hidden test cases; skipped for some referral or
          recruiter-sourced candidates. Durations reported 70-135 min.
        confidence: claimed
        source: https://leetcode.com/discuss/post/7541629/
        seen_on: 2026-02
      - round: Recruiter / phone screen (some loops)
        type: DSA
        duration_min: 45
        assesses: One medium DSA problem with a short resume discussion; in some 2026 loops a single HackerRank live-coding screen gates the drive.
        confidence: claimed
        source: https://leetcode.com/discuss/post/8461584/
        seen_on: 2026-08
      - round: R1 - DSA (hiring drive, same day as R2)
        type: DSA
        duration_min: 60
        assesses: >-
          1-2 LeetCode-medium problems (sometimes hard), often story-wrapped; code must compile and run
          on HackerRank/Codility with your own main() and tests; brute force -> optimal, complexity,
          edge cases, "how would you test this". Often 10-20 min of project discussion first.
        confidence: claimed
        source: https://leetcode.com/discuss/post/7518104/
        seen_on: 2026-01
      - round: R2 - LLD / machine coding (or second DSA)
        type: LLD
        duration_min: 60
        assesses: >-
          Classes, interfaces, patterns (Strategy, Factory, Observer, State), SOLID, extensibility and
          concurrency on problems like rate limiter, parking lot, notification system, cache with
          pluggable eviction; sometimes runnable code, sometimes pseudocode/class diagrams. Some 2026
          rounds are AI-assisted (judged on prompts and verification).
        confidence: claimed
        source: https://leetcode.com/discuss/post/7620569/
        seen_on: 2026-03
      - round: R3 - HLD (scheduled only if R1 and R2 are positive)
        type: HLD
        duration_min: 60
        assesses: >-
          Classic system design (URL shortener, rate limiter, Google Docs, KV store, chat, proximity,
          payment, monitoring) with requirements, APIs, data model, scaling, consistency and failure
          handling; interviewers push past textbook answers. Some candidates get extra DSA/design
          rounds when a round was borderline.
        confidence: claimed
        source: https://leetcode.com/discuss/post/7435112/
        seen_on: 2025-12
      - round: AA ("As Appropriate") / hiring manager
        type: HIRING_MANAGER
        duration_min: 60
        assesses: >-
          Senior manager/director: deep project dive (architecture, trade-offs, "why" at every step),
          behavioural (conflict, failure, mentoring, customer escalations, why Microsoft, AI tools),
          and frequently a coding or design question aimed at the weakest earlier round. Runs 30-100
          min; decides hire/no-hire and level.
        confidence: claimed
        source: https://leetcode.com/discuss/post/7636712/
        seen_on: 2026-03
    bar: >-
      Reports say SDE II needs optimal solutions to mediums quickly, in clean, runnable code with
      tests: a brute-force-first answer was "a major red flag" (7433909), and slow implementation
      sank an L60 loop. Design rounds expect an extensible OO model plus enough HLD depth to defend
      trade-offs; one Azure rejection cited "expected more detailed HLD for SDE2". The level
      (61 vs 62) is decided by YOE and the AA/HM verdict, and a single weak round often means a
      down-level rather than a rejection.
  - role: Senior Software Engineer
    level: "63-64"
    loop:
      - round: Online assessment
        type: DSA
        duration_min: 90
        assesses: 2-3 problems (DP, graph, rerooting-DP-level hards reported); HackerRank or Codility, 90-135 min.
        confidence: claimed
        source: https://leetcode.com/discuss/post/7451130/
        seen_on: 2025-12
      - round: R1 - DSA / coding (sometimes with LRU-style implementation)
        type: DSA
        duration_min: 60
        assesses: Medium-hard trees/graphs/sliding window; concurrency follow-ups (e.g. LRU with TTL, then thread safety).
        confidence: claimed
        source: https://leetcode.com/discuss/post/8300781/
        seen_on: 2026-05
      - round: R2 - Coding + multithreading / LLD
        type: JAVA
        duration_min: 60
        assesses: Coding plus deep concurrency (volatile, synchronized, critical sections, CPU cache effects) or an LLD problem with Java interfaces.
        confidence: claimed
        source: https://roundz.substack.com/p/microsoft-senior-software-engineer-63
        seen_on: 2025-03
      - round: R3 - System design (+ coding), often 90 min with a principal engineer
        type: HLD
        duration_min: 90
        assesses: >-
          Team-relevant system design (Azure Storage -> file system internals; scheduler; KV store;
          analytics) plus a deep dive into your current system's design, throughput and latency.
        confidence: claimed
        source: https://leetcode.com/discuss/post/7451130/
        seen_on: 2025-12
      - round: AA / hiring manager / director
        type: HIRING_MANAGER
        duration_min: 90
        assesses: >-
          Project deep dive, behavioural (failure, motivation, conflict), sometimes code review of a
          Java/SQL snippet or implementing a data structure from scratch; checks the senior bar
          (scope, ownership, influence) and may offer a downgrade to 62.
        confidence: claimed
        source: https://leetcode.com/discuss/post/7451130/
        seen_on: 2025-12
    bar: >-
      At senior level the loop expects you to own architecture end to end: you draw your current
      system with throughput, latency, failure modes and blast radius, and justify each choice. Design
      answers have to go deep in the team's domain, such as storage internals for Azure Storage or
      ads and data infra for Ads. A 2025 report shows a 4.5-YOE candidate who did well being
      offered a downgrade from 63, and a 2026 rejection cited a lack of practical, large-system design
      depth even though the DSA was strong.

