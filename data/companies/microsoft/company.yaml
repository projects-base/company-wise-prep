official:
  hiring_process:
    - step: Explore open jobs
      detail: Search by keyword, location or job ID; the portal shows AI-powered "good"/"strong" match recommendations.
      source: https://careers.microsoft.com/v2/global/en/hiring-tips.html
    - step: Submit application
      detail: Create a profile, answer required questions, upload a resume, submit per posting.
      source: https://careers.microsoft.com/v2/global/en/hiring-tips.html
    - step: Application review
      detail: >-
        The hiring team reviews applications; some roles include a brief screening conversation
        before interviews. Microsoft says it usually cannot give individual feedback to candidates
        not selected.
      source: https://careers.microsoft.com/v2/global/en/hiring-tips.html
    - step: Interview
      detail: >-
        "Typically 2-4 conversations" of up to one hour each, by phone, Microsoft Teams or in person.
        Steps vary by role and can include meeting teammates and cross-functional colleagues, coding
        exercises, portfolio reviews or work-sample presentations. Interview requests are accepted
        and scheduled in the candidate's Action Center.
      source: https://careers.microsoft.com/v2/global/en/hiring-tips.html
    - step: Technical interview format
      detail: >-
        Technical interviews assess problem solving (how you break a problem down), design of new
        systems, coding in your strongest language (clean, bug-free) and testing (writing tests,
        finding edge cases). The format "typically runs 45 minutes".
      source: https://careers.microsoft.com/v2/global/en/hiring-tips/technical-interviewing
    - step: Offer
      detail: Offer documents arrive by email, Action Center or a secure link; "Total Rewards" framing (salary, bonus, stock, benefits).
      source: https://careers.microsoft.com/v2/global/en/hiring-tips.html
    - step: Pre-onboard and hired
      detail: Recruiting confirms start date and pre-hire requirements (background check); new hires get an onboarding plan and buddy.
      source: https://careers.microsoft.com/v2/global/en/hiring-tips.html
  interview_tips:
    - text: Research the role, industry trends and Microsoft's competitive position; prepare questions to ask - the interview is "a two-way conversation".
      source: https://careers.microsoft.com/v2/global/en/hiring-tips/interview-tips.html
    - text: Map your experience to the job description and prepare specific examples using STAR(R) - Situation, Task, Action, Result, Reflection (what you learned).
      source: https://careers.microsoft.com/v2/global/en/hiring-tips/interview-tips.html
    - text: Understand Microsoft culture before interviewing - growth mindset, diversity and inclusion, One Microsoft collaboration, customer obsession, values and manager expectations.
      source: https://careers.microsoft.com/v2/global/en/hiring-tips/interview-tips.html
    - text: Show your thinking - ask clarifying questions, state assumptions and explain reasoning; "We want to see not only what you know, but also how you think."
      source: https://careers.microsoft.com/v2/global/en/hiring-tips/interview-tips.html
    - text: Be authentic ("come as you are"); afterwards ask about timelines and send a thank-you note via the recruiter.
      source: https://careers.microsoft.com/v2/global/en/hiring-tips/interview-tips.html
    - text: Prepare algorithms (e.g. quicksort, merge sort), data structures (arrays, linked lists, trees, hash maps, graphs) and system design (distributed systems, auto-scaling, CAP); "Practice, practice, practice".
      source: https://careers.microsoft.com/v2/global/en/hiring-tips/technical-interviewing
    - text: In coding interviews, ask clarifying questions, plan before implementing, and test your solution thoroughly before finishing.
      source: https://careers.microsoft.com/v2/global/en/hiring-tips/technical-interviewing
    - text: >-
        (Microsoft Life article, 2016 - dated) Talk out loud, diagram before coding, check your work
        without prompting, consider efficiency; interviewers look for care for product quality and
        customer experience, adaptability to changing requirements and responsiveness to feedback.
      source: https://news.microsoft.com/life/how-to-ace-a-technical-interview-at-microsoft/
  conflicts_with_reports:
    - >-
      Microsoft says 2-4 conversations of up to an hour (technical ~45 min). India SDE II / Senior
      reports from 2025-2026 consistently describe an online assessment (Codility or HackerRank,
      70-135 min) plus 3-6 interviews, several running 75-120 minutes, scheduled as a "hiring
      drive" where R3/R4 depend on R1/R2 feedback.
    - >-
      Microsoft's pages do not name the "AA (As Appropriate)" round; every India loop report has a
      final senior-leader round called AA or hiring-manager round, and recruiters describe it as
      behavioural/culture-fit, yet many reports include coding or design in it.
    - >-
      Microsoft does not mention online assessments; nearly all external India SDE II / Senior
      candidates report one (referrals and recruiter-sourced candidates sometimes skip it).
