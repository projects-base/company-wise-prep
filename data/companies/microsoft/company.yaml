slug: microsoft
name: Microsoft
aliases: [MSFT, Microsoft IDC, Microsoft India Development Center, Microsoft India]
researched_on: 2026-10-07
domain_notes: >-
  India engineering (IDC) sits mainly in Hyderabad, Bengaluru and Noida, across Azure (Compute,
  Storage, AI Search, Data Factory), Microsoft 365 / Copilot (M365 Core, Connectors, ODSP),
  Windows + Devices (Windows, Xbox, Surface ops), Core AI, Microsoft AI / Ads, CO+I and Commercial
  Sales Experiences. Primary stacks in current India postings are C#/.NET and C++; Java appears as an
  explicit stack only in some teams (Azure AI Search builds "in C#, C++, and Java"; WPX Family
  services want "C# or Java"; Devices Ops lists Java). Every posting's minimum qualification lists
  "C, C++, C#, Java, JavaScript, or Python", and interviewers let you code in your resume language
  (one 2026 candidate was asked to use Java because the resume was Java). Postings stress live-site
  ownership (DRI on-call), observability, security, and AI-assisted engineering (GitHub Copilot,
  agents, MCP). Some 2026 loops are explicitly AI-assisted: candidates were told to use AI in an LLD
  round and judged on prompting and verification. Levels (third-party): 59-60 SDE, 61-62 SDE II /
  Software Engineer II, 63-64 Senior Software Engineer; down-levelling (62 -> 61, 63 -> 62) after one
  weak round or for low YOE is commonly reported.
