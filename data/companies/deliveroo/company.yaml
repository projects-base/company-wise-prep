slug: deliveroo
name: Deliveroo
aliases: [Deliveroo India, Roofoods]
leetcode_company: Deliveroo
researched_on: 2026-11-25
domain_notes: >-
  Food and grocery delivery marketplace (consumers, riders, restaurants), part of DoorDash since 2 Oct 2025.
  Hyderabad is Deliveroo's only engineering hub in India (the Bengaluru hub closed in Feb 2026; the India page says over
  400 people). Backend work is mostly Go and Ruby on AWS with PostgreSQL, DynamoDB, Redis and Kafka; no Hyderabad posting
  read mentions Java. DoorDash, Wolt and Deliveroo are moving to one technology stack ("significant work remains", Oct
  2026), and DoorDash runs its own Hyderabad hub and job board, so check which company's process applies.
values:                            # both sets: the values page changed in Nov 2026, the interview guide still names the old six
  - name: "Current (shared with DoorDash and Wolt): start from the ideal customer experience; break problems into input drivers; speed and bias to action; seek disconfirming evidence; small improvements compound; company > team > self; best idea wins, then commit; embrace new technology; plan for the long term"
    source: https://careers.deliveroo.co.uk/our-values/
  - name: "Older six (still named in the backend guide): live and breathe our marketplace; play to win; celebrate difference; champion big and small innovations; obsess about operational excellence; be curious and intellectually honest"
    source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
roles:
  - role: Software Engineer II (Hyderabad, backend)
    level: SE II
    loop:
      - round: Recruiter prescreen
        type: HIRING_MANAGER
        duration_min: 30
        assesses: Informal chat about you and the role, 20 to 45 minutes.
        confidence: claimed
        source: https://careers.deliveroo.co.uk/interview-guide-for-engineers/
        seen_on: 2026-03
      - round: HackerRank technical screen (backend)
        type: DSA
        duration_min: 90
        assesses: >-
          Three timed sections, no going back. 15 multiple-choice questions in 20 minutes (testing, system design,
          microservices, REST, problem-solving), then 70 minutes of algorithms and REST API coding in your strongest
          language. Candidates report a rate limiter variation and a paginated REST API task.
        confidence: claimed
        source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
        seen_on: 2026-02
      - round: Coding interview (take-home extension, or live HackerRank)
        type: LLD
        duration_min: 60
        assesses: >-
          Option 1: a home task submitted at least 48 hours before (reported: a cron expression parser, max 3 hours), then
          10-15 minutes of walkthrough and 25-30 minutes extending it live in your own IDE. Option 2: a 50-minute live
          HackerRank problem. Judged on coding, problem-solving, communication and testing. No AI. Which option
          Hyderabad SE II gets is not published.
        confidence: claimed
        source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
        seen_on: 2026-02
      - round: Architecture interview
        type: HLD
        duration_min: 60
        assesses: >-
          Design a system from a product brief that "you could hand off to an engineering team": requirements, persistence,
          communication, production challenges, edge cases. 45 minutes of design, no AI. Most-reported prompt: 6 million
          free burgers claimed in 10 minutes.
        confidence: claimed
        source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
        seen_on: 2026-02
      - round: Behavioural interview
        type: BEHAVIORAL
        duration_min: 60
        assesses: >-
          STAR stories on communication, leadership, problem-solving, flexibility, initiative, organisation and decision
          making. One L5 candidate reported a rejection on this round alone.
        confidence: claimed
        source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
        seen_on: 2026-02
      - round: Hiring committee and team allocation (no interview)
        type: HIRING_MANAGER
        assesses: A calibrated group reads the whole process and decides; a team is then matched.
        confidence: claimed
        source: https://careers.deliveroo.co.uk/interview-guide-for-engineers/
        seen_on: 2026-03
      - round: "Reported, Hyderabad Senior Engineer: HackerRank, cron take-home with live extensions, flash-sale design, behavioural"
        type: LLD
        assesses: 15 MCQs and a rate limiter; at most two or three extensions, each with a test; pushback during behavioural.
        confidence: claimed
        source: https://leetcode.com/discuss/interview-experience/7082718/
        seen_on: 2025-08
      - round: "Reported, London L4/L5 (looks like DoorDash's AI-allowed format)"
        type: LLD
        assesses: MCQs, bug fix and feature addition with AI allowed, an AI coding round, LeetCode, behavioural, team matching.
        confidence: claimed
        source: https://www.glassdoor.com/Interview/Deliveroo-Software-Engineer-Interview-Questions-EI_IE1053365.0,9_KO10,27.htm
        seen_on: 2026-05
    bar: >-
      No SE II bar is published for India. A London SE II posting (Oct 2026) describes goals across your team, system health
      and monitoring, code review, influence on the roadmap in your domain and interviewing others. Inference: a clean,
      tested, extensible solution and a practical design with failure modes matter more than algorithm speed.
official:
  hiring_process:
    - step: Posting text
      detail: "Hyderabad postings say the interview typically includes 3-4 stages and link the interview guide for engineers."
      source: https://job-boards.greenhouse.io/deliveroo/jobs/8311914
    - step: Coding interview rules
      detail: Submit the take-home at least 48 hours before; AI-generated submissions are rejected; no ChatGPT or Copilot in the live part.
      source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
    - step: GenAI policy (conflicts with the backend guide on take-homes; follow the stricter rule and ask)
      detail: AI allowed on take-homes if disclosed unless told otherwise; not allowed in live interviews.
      source: https://careers.deliveroo.co.uk/using-generative-ai-in-your-interview-process/
  interview_tips:
    - text: Use your strongest coding language; submit before time runs out; cover happy and sad paths; say when the main task is done.
      source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
    - text: >-
        Architecture: clarify quickly, start high level, iterate and note risks; pick technology you have run in production
        and justify it; cover scale, reliability, failure modes and how you would gain confidence before rollout.
      source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
    - text: Practice ideas named by Deliveroo engineers - a social media site, theatre booking, food delivery.
      source: https://deliveroo.engineering/2022/01/14/preparing-for-the-deliveroo-architecture-interview.html
    - text: >-
        Behavioural examples the company publishes - a missed deadline and what you learned; a challenge you made sure was
        completed; a difference of opinion with a colleague and how you concluded.
      source: https://careers.deliveroo.co.uk/our-interview-guide-backend-engineering/
