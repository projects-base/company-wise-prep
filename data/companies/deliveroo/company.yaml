frameworks_to_prepare:
  revise:
    - {name: REST API design and HTTP clients, why: "A HackerRank section and MCQs", academy: [W2, W7], plan: "Write the paginated API task in Java's HttpClient from memory, twice."}
    - {name: PostgreSQL, why: "Every posting", academy: [Q5, Q6], plan: "Explain indexes, isolation and locking for the burger claim."}
    - {name: Testing, why: "MCQs, take-home and extension rounds are judged on it", academy: [D12], plan: "Write parameterised JUnit 5 tests for the cron parser, happy and sad paths."}
    - {name: "Microservices, resilience and system design", why: "MCQs and the architecture round", academy: [S8, I3, H4], plan: "One timed design from a blank page, with failure modes and a rollout plan."}
  learn:
    - {name: Go, why: "Core language of the job, none in the profile", academy: [], plan: "Tour of Go, then rewrite the rate limiter in Go; be ready for 'are you happy to move to Go?'", resources: [https://go.dev/tour/]}
    - {name: DynamoDB, why: "Every Hyderabad posting", academy: [Q11], plan: "Know partition and sort keys, GSIs, conditional writes, Streams."}
    - {name: Kafka, why: "Primary messaging; basic in the profile", academy: [I1], plan: "Partitions, consumer groups, delivery guarantees, then the burger claims queue."}
    - {name: Redis, why: "Every posting; basic in the profile", academy: [I2], plan: "Atomic decrement, Lua, hot keys, TTL, persistence: what happens if Redis loses data?"}
    - {name: AWS and ECS, why: "Core cloud; basic in the profile", academy: [I8], plan: "SQS, DynamoDB, ECS vs EKS, ALB, autoscaling, in one page."}
