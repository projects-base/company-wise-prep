roles:
  - role: Software Engineer III
    level: L4
    loop:
      - round: Recruiter screen
        type: HIRING_MANAGER
        duration_min: 20
        assesses: Background, exact years of experience, location preference, CTC expectations; recruiter explains the loop and offers 2-4 weeks to prepare.
        confidence: claimed
        source: https://leetcode.com/discuss/post/6522449/
        seen_on: 2025-03
      - round: Google Hiring Assessment (some candidates)
        type: BEHAVIORAL
        duration_min: 90
        assesses: >-
          Workstyle questionnaire (~30 min), then a proctored DSA OA (~60 min, 2 problems,
          medium + hard DP) for at least one 2026 India L4 candidate. Failing it means a 6-month
          cooldown.
        confidence: claimed
        source: https://leetcode.com/discuss/post/8551877/
        seen_on: 2026-10
      - round: Technical phone screen
        type: DSA
        duration_min: 45
        assesses: One medium problem plus a follow-up in a shared doc (no IDE). Elimination round. Mostly skipped for candidates who interviewed recently.
        confidence: claimed
        source: https://leetcode.com/discuss/post/8525084/
        seen_on: 2026-09
      - round: Googleyness & Leadership (screening stage in 2026 India loops)
        type: BEHAVIORAL
        duration_min: 45
        assesses: >-
          Roughly 6-10 STAR questions on conflict, feedback, ambiguity, prioritisation, credit-taking,
          diversity and helping teammates. In 2026 India L4 loops it runs alongside the phone screen
          as an elimination round. Earlier loops put it after the coding onsites.
        confidence: claimed
        source: https://leetcode.com/discuss/post/8522064/
        seen_on: 2026-09
      - round: Onsite coding x2 (in person, Bengaluru/Hyderabad, often same day)
        type: DSA
        duration_min: 45
        assesses: >-
          Medium-hard problems, often wrapped in a long story that is deliberately vague (clarify
          first), with one or two follow-ups. Graphs, BFS/Dijkstra, union-find, intervals, DP and
          binary search on the answer come up most. Interviewers score code quality and modularity
          (helper functions, classes) and self-driven testing as well as correctness. Older or
          virtual loops had 3 coding rounds; L4 can also choose 2 coding + 1 system design.
        confidence: claimed
        source: https://leetcode.com/discuss/post/8522064/
        seen_on: 2026-09
      - round: Extra / re-round (conditional)
        type: DSA
        duration_min: 45
        assesses: Added when one coding round is weak or the hiring committee asks for more signal.
        confidence: claimed
        source: https://leetcode.com/discuss/post/7164554/
        seen_on: 2025-09
      - round: Team match (hiring-manager calls)
        type: HIRING_MANAGER
        duration_min: 30
        assesses: >-
          Fit with a specific team: past projects, a deep dive into one project, career goals. Can
          take days or months, and one HM call per team (several are common). The HM may give a
          Statement of Support that feeds into the hiring committee.
        confidence: claimed
        source: https://leetcode.com/discuss/post/8473279/
        seen_on: 2026-08
      - round: Hiring committee + offer
        type: HIRING_MANAGER
        duration_min: 0
        assesses: >-
          Packet review (interviewer write-ups, not just Hire/No Hire scores). Can approve, ask for
          another round, or down-level (L5 to L4, L4 to L3).
        confidence: claimed
        source: https://leetcode.com/discuss/post/6426991/
        seen_on: 2025-02
    bar: >-
      Solve a medium-hard problem plus its follow-up in about 35 minutes of a 45-minute round. Ask
      clarifying questions, get to an optimal or near-optimal approach with little help, write clean,
      modular code (one-function solutions have been marked down for readability), and dry-run your
      own test cases. Mixed feedback (one Lean Hire / Lean No Hire) can still pass, but packets with
      repeated "code quality" or "missed edge cases" notes get rejected or down-levelled.
  - role: Senior Software Engineer
    level: L5
    loop:
      - round: Recruiter screen
        type: HIRING_MANAGER
        duration_min: 30
        assesses: Background and level calibration; explains the format (3 DSA + 1 system design + 1 G&L).
        confidence: claimed
        source: https://leetcode.com/discuss/post/6668243/
        seen_on: 2025-04
      - round: Technical phone screen
        type: DSA
        duration_min: 45
        assesses: One medium graph/tree problem. Sometimes skipped based on a previous Google interview.
        confidence: claimed
        source: https://leetcode.com/discuss/post/5285771/
        seen_on: 2024-06
      - round: Coding x3
        type: DSA
        duration_min: 45
        assesses: >-
          Same style as L4 but more open-ended, with follow-ups on scaling, concurrency or
          parallelism (e.g. thread-safe frame buffer, CompletableFuture). Recruiters report SD and
          G&L are scheduled only after at least 2 Hire calls out of 3.
        confidence: claimed
        source: https://leetcode.com/discuss/post/6668243/
        seen_on: 2025-04
      - round: System design
        type: HLD
        duration_min: 60
        assesses: >-
          The candidate drives a large-scale design end to end: requirements, back-of-envelope
          estimates, high-level design, deep dives, bottlenecks, then fitting a requirement change.
          Often a Google-flavoured product (Sheets, image hosting, News feed, cab service,
          Assistant dedup), drawn in Google Docs/Drawings. A Lean Hire here has ended L5 loops.
        confidence: claimed
        source: https://leetcode.com/discuss/post/6349651/
        seen_on: 2025-01
      - round: Googleyness & Leadership
        type: BEHAVIORAL
        duration_min: 45
        assesses: STAR stories showing emergent leadership, conflict handling, mentoring, ambiguity, cross-team influence.
        confidence: claimed
        source: https://leetcode.com/discuss/post/5576037/
        seen_on: 2024-08
      - round: Team match + hiring committee
        type: HIRING_MANAGER
        duration_min: 30
        assesses: >-
          Several HM calls. Statement of Support from an HM. HC can approve L5, down-level to L4
          (then L4 team match), or ask for an extra SD/coding round. References may be requested.
        confidence: claimed
        source: https://leetcode.com/discuss/post/6639707/
        seen_on: 2025-04
    bar: >-
      L5 needs the L4 coding bar (2 of 3 coding rounds at Hire or better) plus a system design round
      the candidate drives: scoping, estimates, trade-offs (SQL vs NoSQL, consistency, caching),
      bottlenecks and absorbing new requirements without starting over. Senior postings add design
      and architecture plus about a year of tech-lead scope. A strong SD with weak coding has led to
      down-levelling to L4, and weak SD with strong coding to rejection.

