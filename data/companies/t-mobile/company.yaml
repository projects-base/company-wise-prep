slug: t-mobile
name: T-Mobile (TMUS Global Solutions)
aliases: [T-Mobile, TMUS, TMUS Global Solutions, TMUS India Private Limited, T-Mobile India, T-Mobile US]
researched_on: 2026-10-08
domain_notes: >-
  T-Mobile US (NASDAQ: TMUS, Bellevue WA) is the US wireless carrier that calls itself "America's
  supercharged Un-carrier". TMUS Global Solutions is the trading name of TMUS India Private Limited,
  its in-house technology centre in Hyderabad. Light Reading (Jun 2026) says it "was established in
  October 2025 to employ the long-term contractors and vendors" that had supported T-Mobile's tech
  development, that it "supports internal technology and engineering functions and does not provide
  customer-facing services", and that it reportedly has about 500 employees, aiming for up to 1,000
  by 2027 (T-Mobile declined to confirm). A 250,000 sq ft Hyderabad facility opened on 4 Jun 2026.
  The India careers site describes TMUS Global Solutions as "purpose-built to drive T-Mobile's
  engineering-led IT transformation" with "bold thinking, radical simplicity, and a relentless 24/7
  delivery mindset". Every India posting says TMUS Global Solutions "has engaged ANSR, Inc. ("ANSR")
  as its exclusive recruiting partner"; all communications and offers come only through ANSR and its
  1Recruit platform, and jobs are listed on ANSR's Talent500 site. No source says ANSR built or
  operates the centre, so that is not claimed here. The target role (Resiliency team) protects
  payments, device activations and customer interactions across multiple datacenters: automated
  failover, cross-datacenter orchestration, observability pipelines and AI Ops, with GitLab CI/CD,
  Python/Bash/YAML, AWS, Kubernetes and CyberArk/Vault. India SRE postings add Terraform, Ansible,
  Splunk, Grafana, Prometheus, OpenTelemetry, AppDynamics, Jenkins, ServiceNow/ITIL.

