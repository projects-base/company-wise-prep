frameworks_to_prepare:   # against an assumed profile (data/profile.yaml not present yet): Java 21 / Spring Boot / JPA / REST / PostgreSQL backend, ~5.5 yrs
  revise:
    - {name: Distributed systems fundamentals and failure modes, why: "JD must-have: first-principles fault tolerance and failure modes", academy: [F2, F1], plan: "Write a one-page list of failure modes (crash, partition, slow node, clock skew, split-brain, retry storm) with one detection and one mitigation each."}
    - {name: Resilience patterns (circuit breaker, retry + backoff + jitter, timeouts, bulkhead, idempotency), why: "JD fault tolerance; Java posting names them", academy: [S8, F2], plan: "Re-explain each with a Resilience4j config from your own services and the failure it prevents.", resources: [https://resilience4j.readme.io/docs/circuitbreaker, https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/, https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead]}
    - {name: Replication, consistency and data failover (sync vs async, replica lag, RPO), why: "Cross-datacenter failover of payment/activation data", academy: [Q8, F2, Q6], plan: "Explain Postgres streaming replication, what is lost on failover (RPO), and how fencing avoids split-brain."}
    - {name: Spring Boot Actuator health, readiness and metrics, why: "JD health-check mechanisms; Akhil's own production services are the bridge", academy: [D8], plan: "Map /actuator/health liveness/readiness groups to Kubernetes probes and Micrometer metrics to Prometheus.", resources: [https://docs.spring.io/spring-boot/reference/actuator/endpoints.html]}
    - {name: Event-driven microservices, outbox and Kafka scenarios, why: "Reported round 3 Kafka scenario; 6/11 postings microservices", academy: [S9, S8], plan: "Rehearse: consumer lag spike, poison message, duplicate delivery, rebalance storm, and the outbox fix.", resources: [https://microservices.io/patterns/data/transactional-outbox.html]}
    - {name: Core Java, OOP, concurrency, JVM, why: "Reported round 1: core Java, polymorphism, static methods, SOLID", academy: [A1, B2, B4, E1], plan: "One evening: OOP pillars, overriding vs hiding, SOLID by example, thread pools and deadlocks."}
    - {name: Code-level design patterns (strategy, template method, observer, state), why: "Failover runbooks as pluggable strategies; health-state transitions; inferred from the JD's automation standards", academy: [E2, E3, E4], plan: "Sketch a failover orchestrator: Strategy per app type, Template Method for drain → switch → verify, Observer for health events."}
    - {name: System design method and monitoring case study, why: "Reported HLD rounds; JD observability pipelines", academy: [F3, F6], plan: "Do F6 metrics & monitoring once, then design 'failover readiness dashboard' end to end."}
    - {name: SQL and slow-query diagnosis, why: "Reported SQL round; App SRE: find slow SQL causing latency", academy: [Q5, Q7], plan: "Revise EXPLAIN and pg_stat_statements; one story of a DB-caused latency incident."}
  learn:
    - {name: Cross-datacenter failover (active-active vs active-passive, DNS/GSLB, RTO/RPO, split-brain), why: "The core of the role", academy: [F2, Q8], plan: "Read the AWS DR options whitepaper and Route 53 failover; draw both topologies for a payment API with RTO/RPO numbers.", resources: [https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html, https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover.html]}
    - {name: GitLab CI/CD and YAML, why: "JD must-have", academy: [], plan: "Evening build: .gitlab-ci.yml with build/test/package/deploy stages, rules, needs, artifacts, a manual 'failover' job and include/extends templates.", resources: [https://docs.gitlab.com/ci/quick_start/, https://docs.gitlab.com/ci/yaml/]}
    - {name: Python and Bash for ops automation, why: "JD must-have; 11/11 postings", academy: [], plan: "Write a Python health-check poller (requests + retries + exit codes) and a Bash wrapper with set -euo pipefail, traps and logging.", resources: [https://docs.python.org/3/tutorial/]}
    - {name: Kubernetes in production (probes, rollouts, HPA, PDB, debugging Pending/CrashLoop), why: "JD must-have at production scale", academy: [S9], plan: "On kind/minikube: deploy a Spring Boot app with liveness/readiness/startup probes, break each probe, fix with kubectl describe/logs/events.", resources: [https://kubernetes.io/docs/tutorials/kubernetes-basics/, https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/]}
    - {name: Secret management (HashiCorp Vault; CyberArk concepts), why: "JD must-have", academy: [], plan: "Run Vault dev server, store a DB secret, read it from a GitLab job via JWT/OIDC and from a pod; know dynamic secrets, leases and rotation.", resources: [https://developer.hashicorp.com/vault/docs/what-is-vault, https://developer.hashicorp.com/vault/tutorials/get-started, https://docs.gitlab.com/ci/secrets/hashicorp_vault/, https://developer.hashicorp.com/vault/docs/platform/k8s]}
    - {name: SLI / SLO / error budgets and alerting on symptoms, why: "Failover readiness needs measurable targets; SRE postings", academy: [F6], plan: "Write SLOs for 'payment authorisation' and 'device activation' and a multi-window burn-rate alert.", resources: [https://sre.google/sre-book/service-level-objectives/, https://sre.google/workbook/implementing-slos/, https://prometheus.io/docs/practices/alerting/]}
    - {name: Observability stack (OpenTelemetry, Prometheus, Grafana, Splunk), why: "JD nice-to-have; 7–9/11 postings", academy: [F6, D8], plan: "Instrument a Spring Boot service with the OTel Java agent, scrape with Prometheus, build a Grafana latency + error panel.", resources: [https://opentelemetry.io/docs/concepts/signals/, https://grafana.com/docs/grafana/latest/getting-started/get-started-grafana-prometheus/]}
    - {name: Health-check design (shallow vs deep, dependency checks, fail-open), why: "JD health-check mechanisms", academy: [F6], plan: "Read the AWS Builders' Library article and write down which checks gate failover and which only alert.", resources: [https://aws.amazon.com/builders-library/implementing-health-checks/]}
    - {name: Chaos engineering and failover drills, why: "Proving failover readiness; SRE postings ask for resilience validation", academy: [], plan: "Read the principles; plan a game day: hypothesis, blast radius, abort criteria, metrics.", resources: [https://principlesofchaos.org/]}
    - {name: Ansible, why: "JD nice-to-have; 7/11 postings", academy: [], plan: "Write one playbook with an inventory, a role and a handler that drains a node and restarts a service.", resources: [https://github.com/ansible/ansible]}
    - {name: Terraform, why: "7/11 postings; tag on the Resiliency posting", academy: [], plan: "Follow the AWS get-started tutorial; know state, locking, plan/apply, modules.", resources: [https://developer.hashicorp.com/terraform/tutorials/aws-get-started]}
    - {name: Blue-green / canary and smoke-test gates, why: "App SRE: smoke tests before promotion", academy: [S9], plan: "Add a canary + smoke-test stage to the GitLab pipeline you built.", resources: [https://martinfowler.com/bliki/BlueGreenDeployment.html]}

