    source: https://careers.t-mobile.com/culture-and-benefits
  - name: "Dream big and deliver (aim high, take smart risks, own our results, act like owners)"
    source: https://careers.t-mobile.com/culture-and-benefits
  - name: "Do it the right way. Always. (for customers, shareholders, society and each other)"
    source: https://careers.t-mobile.com/culture-and-benefits
  - name: "We won't stop (relentless, never complacent, bust down barriers, make change)"
    source: https://careers.t-mobile.com/culture-and-benefits
  - name: >-
      TMUS Global Solutions framing: "bold thinking, radical simplicity, and a relentless 24/7
      delivery mindset"; "speed, agility, and scale" for T-Mobile's "digital 'Un-carrier' future"
    source: https://talent500.com/t-mobile/careers/india/
  - name: >-
      Resiliency JD "Who you are": self-driven, first-principles thinker, collaborative, fast learner,
      independent operator, comfortable with ambiguity, relationship builder, clear communicator,
      continuous improver, knowledge sharer; "accountability mindset"
    source: https://talent500.com/jobs/t-mobile/sr-engineer-software-hyderabad-T500-28132/

roles:
  - role: Senior Software Engineer – Resiliency (recruiter title "Sr Engineer, Software"), TMUS Global Solutions, Hyderabad
    level: Sr Engineer (5–8 yrs)
    loop:
      - round: Application screening questions (Talent500 / 1Recruit)
        type: HIRING_MANAGER
        assesses: >-
          Every TMUS India posting on Talent500 carries multiple-choice screening questions on years of
          experience in the core skill (for example "How many years of experience do you have in SRE?",
          "...in Python / Java?"). The Resiliency posting asks about Python / Java. Official, but it is a
          filter, not an interview.
        confidence: claimed
        source: https://talent500.com/jobs/t-mobile/sr-engineer-software-hyderabad-T500-28132/
        seen_on: 2026-08
      - round: Round 1, technical (virtual)
        type: JAVA
        duration_min: 60
        assesses: >-
          Reported for an Associate SE in Hyderabad (2026): a third party ran round 1, covering core Java,
          Spring Boot, SQL queries, one coding problem, SOLID and system design (polymorphism; can static
          methods be overridden). For a Senior SE in Hyderabad (Oct 2025): fundamentals and how you approach
          a problem rather than Q&A; binary search, optimising an API, "how does your day look". Duration
          is assumed, not reported.
        confidence: claimed
        source: https://www.glassdoor.co.in/Interview/T-Mobile-Senior-Software-Engineer-Interview-Questions-EI_IE9302.0,8_KO9,33.htm
        seen_on: 2025-10
      - round: Round 2, HLD of your current project (virtual, interviewer from the US)
        type: HLD
        assesses: >-
          One reply in the Glassdoor "TMUS Global Solutions, India" community: "2nd round: HLD of your
          current project ... virtual, someone from US". Undated post (the community exists only since
          TMUS Global Solutions formed in Oct 2025).
        confidence: claimed
        source: https://www.glassdoor.com/Community/tmus-global-solutions-india/i-have-r1-interview-for-senior-engineer-role-with-tmus-can-someone-help-with-their-interview-experience-thanks-in
      - round: Round 3, face to face in Hyderabad (HLD + Kafka scenario + DSA)
        type: HLD
        assesses: >-
          Same reply: "3rd round: f2f HLD, kafka scenario based question, DSA". A separate community post
          confirms a third technical round held F2F in Hyderabad on 6 March, followed the same day by an
          HR round; the offer was then put on hold. Read via search-engine snippets only.
        confidence: claimed
        source: https://www.glassdoor.co.in/Community/tmus-global-solutions-india/right-after-my-third-round-of-technical-interviews-which-was-f2f-in-hyderabad-on-march-6th-i-had-an-hr-round-they-gave-me-a
        seen_on: 2026-03
      - round: HR round (compensation, documents, offer)
        type: BEHAVIORAL
        assesses: >-
          Reported right after the final technical round. Several candidates report offers or profiles put
          "on hold" after this stage (one Sr SWE was told they were kept as a backup candidate).
        confidence: claimed
        source: https://www.glassdoor.co.in/Community/tmus-global-solutions-india/right-after-my-third-round-of-technical-interviews-which-was-f2f-in-hyderabad-on-march-6th-i-had-an-hr-round-they-gave-me-a
        seen_on: 2026-03
    bar: >-
      The posting's own bar: "strong first-principles understanding of distributed systems, fault
      tolerance, and failure modes — not just framework familiarity, but genuine depth earned through
      production experience", end-to-end ownership "with minimal hand-holding", and documentation as "a
      first-class deliverable". A hire can explain why a failover pattern exists, what breaks it
      (split-brain, replication lag, stale DNS), how they would detect readiness and prove it with
      dashboards and drills, and can automate it in GitLab CI + Python/Bash on Kubernetes/AWS. This
      reading is an inference from the JD; no report describes the Resiliency team's own loop.

official:
  hiring_process:
    - step: Apply through ANSR (Talent500 / 1Recruit)
      detail: >-
        "TMUS India Private Limited, operating as TMUS Global Solutions, has engaged ANSR, Inc. ("ANSR") as
        its exclusive recruiting partner. That means that any communications regarding TMUS Global
        Solutions opportunities or employment offers will be issued only through ANSR and the 1Recruit
        platform." India jobs are listed on talent500.com/t-mobile/careers/india/ (ANSR's Talent500), not
        on T-Mobile's US Workday site, which returned 0 results for Hyderabad.
      source: https://talent500.com/t-mobile/careers/india/
    - step: Screening questions at application
      detail: Multiple-choice questions on years of experience in the posting's core skill.
      source: https://talent500.com/jobs/t-mobile/sr-engineer-site-reliability-hyderabad-T500-29902/
    - step: Fraud warning
      detail: >-
        TMUS Global Solutions "will never seek any payment or other compensation during the hiring process
        or request sensitive personal data (such as bank details or government-issued identification
        numbers) prior to a candidate's acceptance of a formal offer."
      source: https://talent500.com/jobs/t-mobile/senior-engineer-site-reliability-hyderabad-T500-29769/
    - step: No published interview-process page
      detail: >-
        careers.t-mobile.com has a culture page and an internship FAQ (internship interviews run Fall to
        March) but no general "how we hire" page. Neither site describes the TMUS Global Solutions loop.
      source: https://careers.t-mobile.com/internship
  interview_tips:
    - text: >-
        No official interview tips exist for TMUS Global Solutions. The Resiliency JD's own wording is the
        best guide: reason from first principles, own problems end to end, "escalate with context and a
        proposed path forward", and treat documentation as a deliverable.
      source: https://talent500.com/jobs/t-mobile/sr-engineer-software-hyderabad-T500-28132/
  engineering_signals:
    - text: >-
        Resiliency team: "millions of payments, device activations, and customer interactions processed
        every day ... When those systems fail, customers feel it immediately." Building "automated failover,
        cross-datacenter orchestration, observability pipelines, and AI Ops"; async-first with sync
        touchpoints across U.S. and India time zones.
      source: https://talent500.com/jobs/t-mobile/sr-engineer-software-hyderabad-T500-28132/
      accessed: 2026-10-08
    - text: >-
        App SRE postings give concrete expectations: find whether an API outage is Kubernetes pod networking,
        API gateway misconfig or DB latency; debug Pending pods (node capacity, taints/tolerations,
        autoscaler logs); Python script to collect pod logs on crash; Prometheus alert rules for DB query
        spikes; Grafana latency dashboards; smoke tests before promoting deployments; act as incident
        commander and write RCAs; tune HPA when CPU-throttled; WAF false positives; ChatOps bots.
      source: https://talent500.com/jobs/t-mobile/senior-engineer-site-reliability-hyderabad-T500-29769/
      accessed: 2026-10-08
    - text: >-
        A sibling posting "Software Engineer – Resiliency" (T500-27016, 3+ years) with the same failover /
        GitLab / Kubernetes / CyberArk text appeared on a job aggregator; it is now removed (404) and was read
        only through a search snippet.
      source: https://jobs.joindevops.com/jobs/508869278-engineer-software-devops-automation-t500-27016
      accessed: 2026-10-08
