slug: entain
name: Entain
aliases: [Entain India, Entain plc, Ivy, Ivy Comptech, GVC, bwin.party]
researched_on: 2026-10-08
domain_notes: >-
  Entain plc is a London-listed sports betting and gaming group (Ladbrokes, Coral, bwin,
  Sportingbet, Eurobet, partypoker, Neds; BetMGM is a 50/50 JV with MGM Resorts). Entain India
  (Hyderabad, plus a small Pune office) is the group's technology centre, formerly Ivy Comptech.
  The careers site calls it a "global capability centre" in a new Hyderabad office built in 2025.
  Current India postings are Java-first (SDE I/II/III "Java", Product & Technology team, reporting
  to an Engineering Manager) and ask for distributed architectures, microservices, event-driven
  architecture, SQL (indexing, migrations), Docker/Kubernetes, CI/CD, observability, on-call and
  the RFC process. Some postings also ask for Angular/React, AWS, Redis, Kafka/RabbitMQ and
  WebSockets/SSE. On AWS, Entain standardised on Amazon EKS as the base of its internal developer
  platform, moved databases to Amazon Aurora PostgreSQL with AWS DMS ("near-zero downtime"), cut
  deployment time from weeks to 2 hours, and uses Kiro for code modernisation (AWS case study,
  2026). A Redpanda (vendor) case study says Entain replaced Confluent Cloud with Redpanda BYOC and
  streams into Snowflake, for live odds, fraud detection, player safety and personalisation.
  Postings since Aug 2026 mention AI coding tools (Kiro, Copilot).
values:
  - name: Do what's right (customers first, player protection, integrity, safe to speak up)
    source: https://entaincareers.com/our-offer/mission-values/
  - name: Keep it simple (clear goals and ownership, remove complexity)
    source: https://entaincareers.com/our-offer/mission-values/
  - name: Go beyond (curious, learn from setbacks, embrace change)
    source: https://entaincareers.com/our-offer/mission-values/
  - name: Win together (collaborate across teams, share ideas, celebrate wins)
    source: https://entaincareers.com/our-offer/mission-values/
  - name: >-
      Maker Dimensions (Entain India competency set in a 2026 posting): AI fluency, agency and
      accountability, systems thinking, stakeholder engagement, improve performance,
      cross-functional versatility, product sense, build capability
    source: https://jobs.smartrecruiters.com/Entain/744000154403050-portfolio-lead

roles:
  - role: Software Development Engineer II (Entain India, Hyderabad)
    level: SDE II
    loop:
      - round: Technical round 1 (18 Sep 2026, Microsoft Teams, ~1 h)
        type: JAVA
        duration_min: 60
        assesses: >-
          Invite topics: Java Concepts, Coding Concepts, Problem Solving. Akhil passed this round.
        confidence: verified
        source: interview invite relayed by Akhil, 2026-09
        seen_on: 2026-09
      - round: Technical round 2 (13 Oct 2026, 3:00 PM IST, Microsoft Teams)
        type: HLD
        duration_min: 60
        assesses: >-
          HR-named focus areas: System Design; Database performance and scalability; SQL. The invite
          lists the Entain India tech recruiter (Boddu V V Rama Pavan Vamsi Krishna Kumar), who is
          most likely the organiser, not the technical interviewer. The duration is assumed from
          round 1.
        focus_areas: [System Design, Database performance and scalability, SQL]
        confidence: verified
        source: HR email relayed by Akhil, 2026-10-08
        seen_on: 2026-10
      - round: Insider tip on what Entain India interviews focus on
        type: DOMAIN
        assesses: >-
          Event-driven systems, WebSockets, SQL, AWS, multithreading, and casino/betting
          architecture.
        confidence: claimed
        source: insider tip relayed by Akhil, 2026-09-16
        seen_on: 2026-09
      - round: Online assessment (HackerRank, reported)
        type: DSA
        assesses: Two coding questions; one 2024 SDE 2 candidate reported this as the first step.
        confidence: claimed
        source: https://www.glassdoor.co.in/Interview/Entain-India-SDE-2-Interview-Questions-EI_IE257530.0,12_KO13,18.htm
        seen_on: 2024-07
      - round: Technical round (reported)
        type: DSA
        duration_min: 60
        assesses: >-
          Live coding (2024 SDE 2 report: three problems including LRU cache and longest consecutive
          sequence) plus sync vs async calls in Spring Boot and some design. An April 2026 Software
          Engineer report adds Java concepts (OOP, collections) and SQL queries and optimization.
        confidence: claimed
        source: https://www.glassdoor.co.in/Interview/Entain-India-SDE-2-Interview-Questions-EI_IE257530.0,12_KO13,18.htm
        seen_on: 2024-07
      - round: Design and coding round (reported, senior roles)
        type: HLD
        assesses: Design a distributed queue with multiple producers and consumers, plus coding.
        confidence: claimed
        source: https://www.glassdoor.com/Interview/Entain-Hyderabad-Interview-Questions-EI_IE341832.0,6_IL.7,16_IM1076.htm
        seen_on: 2025-08
      - round: Techno-managerial round (reported)
        type: HIRING_MANAGER
        duration_min: 60
        assesses: Technical plus behavioural questions about past work.
        confidence: claimed
        source: https://www.glassdoor.co.in/Interview/Entain-India-SDE-2-Interview-Questions-EI_IE257530.0,12_KO13,18.htm
        seen_on: 2024-07
      - round: HR competency round (reported)
        type: BEHAVIORAL
        assesses: Competency and fit; benefits discussion.
        confidence: claimed
        source: https://www.glassdoor.co.in/Interview/Entain-India-SDE-2-Interview-Questions-EI_IE257530.0,12_KO13,18.htm
        seen_on: 2024-07
    bar: >-
      Postings describe SDE II as someone who designs and delivers "well-defined, moderately complex
      features" end to end, debugs across environments, is the initial on-call responder, drives the
      RFC process and mentors juniors. With round 2 focused on system design and databases, the bar is
      probably a clear, practical design with a sound data model, query and index choices you can
      justify, and a concrete plan for scaling reads and writes. This is an inference from the
      postings and the HR email, not something Entain states.

official:
  hiring_process:
    - step: Apply via the careers site
      detail: >-
        careers.entainindia.com lists India roles; postings are hosted on SmartRecruiters
        (jobs.smartrecruiters.com/Entain). The careers site has no "how we hire" or interview-process
        page for tech roles (checked the sitemap). Its job search needs JavaScript; the SmartRecruiters
        public API was used instead.
      source: https://careers.entainindia.com/sitemap/
    - step: Reasonable adjustments
      detail: Every India posting invites candidates to ask for reasonable adjustments at any stage of the recruitment process.
      source: https://jobs.smartrecruiters.com/Entain/744000154123539-software-development-engineer-iii
  interview_tips:
    - text: >-
        Entain's Product & Tech recruiter in Hyderabad (Shivani Bisht): understand why Entain builds
        scalable tech, focus on solving problems at speed, and show how you think, adapt and design
        for scale. (Recruiters quoted on an Entain employer-branding page, Apr 2025.)
      source: https://wherewomenwork.com/Career/6660/Entain-careers-recruitment-team-job-interview-advice
    - text: >-
        Product & Tech recruiter for UK/Austria/Bulgaria (Ferzana Bham): be concise, explain your
        motivation with clear examples, and show curiosity and a collaborative mindset without ego.
      source: https://wherewomenwork.com/Career/6660/Entain-careers-recruitment-team-job-interview-advice
  engineering_signals:
    - text: >-
        Entain standardised on Amazon EKS for its internal developer platform, moved databases to
        Amazon Aurora (PostgreSQL) with AWS DMS at near-zero downtime, cut deploy time from weeks to
        2 hours, and sped a soccer simulation model from 2.5 s to 450 ms. "Using open source database
        technology such as PostgreSQL is a key piece of our modernization journey."
      source: https://aws.amazon.com/solutions/case-studies/entain-case-study/
      accessed: 2026-10-08
    - text: >-
        Vendor case study: Entain replaced Confluent Cloud with Redpanda BYOC and streams to
        Snowflake via Redpanda Connect; data uses include live odds, fraud detection, player safety
        and personalisation. The figures are the vendor's.
      source: https://whitepapers.theregister.com/paper/view/38707/simplifying-real-time-data-streaming-for-analytics-at-scale
      accessed: 2026-10-08
