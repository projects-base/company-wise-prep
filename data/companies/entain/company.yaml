  revise:
    - name: SQL query writing (joins, aggregation, window functions, interview patterns)
      why: "Core in 10/10 postings and a named round-3 focus; profile: sql working"
      academy: [Q1, Q2, Q3, Q4]
      plan: "Write one top-N-per-group, one running-total and one gaps-and-islands query on a bets/wallet schema, out loud, without an IDE."
    - name: PostgreSQL indexes and EXPLAIN
      why: "Round-3 focus (database performance); backend postings ask for 'SQL, indexing'; Entain runs Aurora PostgreSQL; profile: postgresql working"
      academy: [Q5]
      plan: "Explain B-tree vs composite vs partial vs covering index on a bets table, and read one EXPLAIN ANALYZE before and after adding the index."
    - name: Transactions, isolation, row locking and MVCC
      why: "Wallet debit and bet placement are the betting-domain write path; profile: postgresql working"
      academy: [Q6]
      plan: "Sketch the wallet debit two ways (SELECT ... FOR UPDATE vs optimistic version column) and name the anomaly each isolation level allows."
    - name: Query performance in practice (N+1, pagination, batching, connection pooling)
      why: "Database performance focus; Java/JPA stack; profile: spring-data-jpa-hibernate strong"
      academy: [Q7, D6, L7]
      plan: "Have a 2-minute story for an N+1 or pool-exhaustion fix, and explain keyset vs offset pagination for bet history."
    - name: System design method and distributed architectures
      why: "Round-3 focus; 8/10 postings ask for distributed architectures; profile: system-design and distributed-systems working"
      academy: [F1, F3, F2, F8]
      plan: "Do F8 (sports betting platform) end to end in 45 min with requirements, estimates, data model and scaling."
