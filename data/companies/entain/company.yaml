frameworks_to_prepare:     # vs data/profile.yaml; weighted to the 13 Oct round (system design, DB performance + scalability, SQL)
  revise:
    - name: SQL query writing (joins, aggregation, window functions, interview patterns)
      why: "Core in 10/10 postings and a named round-2 focus; profile: sql working"
      academy: [Q1, Q2, Q3, Q4]
      plan: "Write one top-N-per-group, one running-total and one gaps-and-islands query on a bets/wallet schema, out loud, without an IDE."
    - name: PostgreSQL indexes and EXPLAIN
      why: "Round-2 focus (database performance); backend postings ask for 'SQL, indexing'; Entain runs Aurora PostgreSQL; profile: postgresql working"
      academy: [Q5]
      plan: "Explain B-tree vs composite vs partial vs covering index on a bets table, and read one EXPLAIN ANALYZE before and after adding the index."
    - name: Transactions, isolation, row locking and MVCC
      why: "Wallet debit and bet placement are the betting-domain write path; profile: postgresql working"
      academy: [Q6]
      plan: "Sketch the wallet debit two ways (SELECT ... FOR UPDATE vs optimistic version column) and name the anomaly each isolation level allows."
    - name: Query performance in practice (N+1, pagination, batching, connection pooling)
      why: "Database performance focus; Java/JPA stack; profile: spring-data-jpa-hibernate strong"
      academy: [Q7, D6, L7]
      plan: "Have a 2-minute story for an N+1 or pool-exhaustion fix, and explain keyset vs offset pagination for bet history."
    - name: System design method and distributed architectures
      why: "Round-2 focus; 8/10 postings ask for distributed architectures; profile: system-design and distributed-systems working"
      academy: [F1, F3, F2, F8]
      plan: "Do F8 (sports betting platform) end to end in 45 min with requirements, estimates, data model and scaling."
    - name: Microservices patterns (service boundaries, retries, circuit breaker, API gateway)
      why: "Core in 8/10 postings; profile: microservices-patterns working"
      academy: [S8]
      plan: "Name the bet, wallet, odds and settlement services and say what happens when wallet is down (timeouts, retries, circuit breaker, idempotency key)."
    - name: Java and Spring Boot internals
      why: "Core language (9/10); round 1 was Java; profile: java and spring-boot strong"
      academy: [A7, D4, D8]
      plan: "Light touch only: Java 17/21 features and how Actuator metrics expose a slow endpoint."
    - name: Object-oriented design and design patterns
      why: "7/10 postings; profile: gof-design-patterns working"
      academy: [E1, E4]
      plan: "Pick the strategy pattern for bet-type settlement rules (single, accumulator) as a ready example."
    - name: REST API design and OpenAPI
      why: "API integration (7/10) and Swagger (5/10); profile: rest-api-design strong"
      academy: [D5]
      plan: "Write the POST /bets contract with an Idempotency-Key header and the error codes for price-changed and market-suspended."
    - name: Docker and testing
      why: "Core in 9/10 postings; profile: docker working, testing-junit-mockito strong"
      academy: [D8]
      plan: "One sentence each: multi-stage image for a Spring Boot service; Testcontainers for a Postgres integration test."
  learn:
    - name: Scaling PostgreSQL on Aurora (read replicas, failover, partitioning)
      why: "HR named database scalability; Entain moved to Aurora PostgreSQL; profile: aws basic, failover-patterns basic"
      academy: [Q8]
      plan: "Read the Aurora replication and HA pages, then add read replicas, date partitioning of bets and the replica-lag trade-off to your F8 design."
      resources: [https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html, https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html, https://www.postgresql.org/docs/current/ddl-partitioning.html]
    - name: Event-driven architecture with Kafka (outbox, idempotent consumers, saga)
      why: "Core in 7/10 postings and in the AWS case study; Kafka-compatible Redpanda in production; profile: kafka basic, event-driven-architecture basic"
      academy: [S9]
      plan: "Learn topics, partitions, consumer groups and keys, then draw BetPlaced via an outbox table and an idempotent settlement consumer."
      resources: [https://kafka.apache.org/intro, https://microservices.io/patterns/data/transactional-outbox.html, https://microservices.io/patterns/data/saga.html]
    - name: Caching with Redis (cache-aside, TTL, invalidation, hot keys)
      why: "Only 1 posting names Redis, but cheap and clearly relevant: odds reads dwarf bet writes in a scalability round; profile: redis basic"
      academy: [Q8, F1, F6]
      plan: "Learn cache-aside vs write-through and stampede protection, then put odds in Redis with a version per selection in the F8 design."
      resources: [https://aws.amazon.com/caching/best-practices/, https://redis.io/docs/latest/develop/]
    - name: Zero-downtime schema migrations (expand-and-contract, Flyway)
      why: "3 backend postings ask for 'migrations'; Entain migrated to Aurora with DMS at near-zero downtime; not in profile"
      academy: []
      plan: "Learn the expand-migrate-contract steps for renaming a column on a live table and how CREATE INDEX CONCURRENTLY avoids locks."
      resources: [https://documentation.red-gate.com/flyway, https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html]
    - name: Kubernetes on Amazon EKS
      why: "Core: Docker/Kubernetes in 9/10 postings, EKS is Entain's platform base; profile: kubernetes basic, aws basic"
      academy: []
      plan: "Learn pod, deployment, service, HPA and readiness probe well enough to say how the bet service scales at kick-off."
      resources: [https://kubernetes.io/docs/concepts/overview/, https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html]
    - name: Observability (metrics, logs, traces)
      why: "Core: monitoring and logging in 8/10 postings plus on-call; profile: prometheus-grafana basic, opentelemetry none"
      academy: [D8, F6]
      plan: "Learn the RED metrics and trace context, and have an answer to 'how do you find the slow query in production'."
      resources: [https://opentelemetry.io/docs/concepts/, https://prometheus.io/docs/introduction/overview/]
    - name: WebSockets / SSE for live odds fan-out
      why: "One posting and the insider tip; in-play odds push is the classic betting design follow-up; not in profile"
      academy: [F5, F8]
      plan: "Learn how a WebSocket gateway holds connections and fans out from a pub/sub topic, and when SSE is enough."
      resources: [https://docs.spring.io/spring-framework/reference/web/websocket.html]

