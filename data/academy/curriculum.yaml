# The Academy: tracks (each with a display code: JAVA-JVM-3 = 3rd lesson of the JAVA-JVM track) → modules (one ~25-minute lesson each) with prerequisite edges.
# Lessons live in data/academy/lessons/<module-id>.md. Design: docs/CURRICULUM.md.

tracks:
  - id: S
    title: The Story of Backend
    code: BE-STORY
    description: How we got from CGI scripts to AI-native systems — each era's pain, invention and new pain, with labs and real industry cases.
    modules:
      - {id: S0, title: "Foundations: computers, programs, networks, the request", level: 1, minutes: 25, prerequisites: []}
      - {id: S1, title: "CGI: a process per request", level: 2, minutes: 25, prerequisites: [S0]}
      - {id: S2, title: "Servlets & JSP: a thread per request", level: 2, minutes: 25, prerequisites: [S1]}
      - {id: S3, title: "MVC & Struts: the front controller", level: 2, minutes: 25, prerequisites: [S2]}
      - {id: S4, title: "J2EE & EJB 2: the heavyweight container", level: 2, minutes: 25, prerequisites: [S3]}
      - {id: S5, title: "Spring & Hibernate: POJOs, DI, AOP, ORM", level: 2, minutes: 25, prerequisites: [S4]}
      - {id: S6, title: "Annotations, Java config & Maven", level: 2, minutes: 25, prerequisites: [S5]}
      - {id: S7, title: "Spring Boot: convention over configuration", level: 2, minutes: 25, prerequisites: [S6]}
      - {id: S7B, title: "SOA & the enterprise service bus", level: 4, minutes: 25, prerequisites: [S7]}
      - {id: S8, title: "Microservices: why, how, and what it costs", level: 4, minutes: 30, prerequisites: [S7B]}
      - {id: S9, title: "Cloud native & event-driven systems", level: 5, minutes: 30, prerequisites: [S8]}
      - {id: S10, title: "The pendulum: modular monoliths", level: 5, minutes: 25, prerequisites: [S9]}
      - {id: S11, title: "Reactive programming → virtual threads", level: 4, minutes: 25, prerequisites: [S10]}
      - {id: S12, title: "AI-native applications", level: 5, minutes: 25, prerequisites: [S11]}
      - {id: S13, title: "What's next, and how to keep up", level: 5, minutes: 20, prerequisites: [S12]}

  - id: J
    title: Java Fundamentals
    code: JAVA-FUND
    description: The language itself, done properly — from the JDK on your machine to OOP, contracts, exceptions, generics, collections internals, streams and I/O. The questions every Java interview opens with.
    modules:
      - {id: J1, title: "JDK, JRE and JVM: from source file to running program", level: 1, minutes: 20, prerequisites: [S0]}
      - {id: J2, title: "OOP for real: classes, inheritance, polymorphism, interfaces vs abstract classes", level: 1, minutes: 25, prerequisites: [J1]}
      - {id: J3, title: "equals, hashCode, Comparable and immutability", level: 2, minutes: 25, prerequisites: [J2]}
      - {id: J4, title: "Exceptions: checked vs unchecked, try-with-resources, designing errors", level: 2, minutes: 25, prerequisites: [J2]}
      - {id: J5, title: "Generics: type safety, wildcards and type erasure", level: 2, minutes: 25, prerequisites: [J2]}
      - {id: J6, title: "Collections internals: ArrayList, HashMap, TreeMap, LinkedHashMap", level: 2, minutes: 30, prerequisites: [J3, J5]}
      - {id: J7, title: "Lambdas, functional interfaces, Streams and Optional", level: 2, minutes: 30, prerequisites: [J5, J6]}
      - {id: J8, title: "I/O, NIO and JSON with Jackson: serialization done right", level: 3, minutes: 25, prerequisites: [J4, J7]}

  - id: A
    title: Java & the JVM
    code: JAVA-JVM
    description: How Java actually runs — bytecode, class loading, JIT, memory areas, garbage collection, the memory model, versions 8 to 25.
    modules:
      - {id: A1, title: "How Java runs: javac, bytecode, interpreter, JIT", level: 1, minutes: 25, prerequisites: []}
      - {id: A2, title: "JVM memory areas: heap, stack, metaspace", level: 2, minutes: 25, prerequisites: [A1]}
      - {id: A7, title: "Java 8 → 11 → 17 → 21 → 25: what changed and why", level: 2, minutes: 30, prerequisites: [A1]}
      - {id: A3, title: "Class loading and delegation", level: 3, minutes: 25, prerequisites: [A1]}
      - {id: A4, title: "Garbage collection: generations and collectors", level: 3, minutes: 30, prerequisites: [A2]}
      - {id: A6, title: "The Java Memory Model: happens-before and volatile", level: 3, minutes: 25, prerequisites: [A2]}
      - {id: A5, title: "Diagnosing GC and memory leaks", level: 3, minutes: 25, prerequisites: [A4]}
      - {id: A8, title: "Profiling: JFR, flame graphs, JMH", level: 3, minutes: 25, prerequisites: [A4]}

  - id: B
    title: Threads & Concurrency
    code: JAVA-CONC
    description: From the thread lifecycle to executors, CompletableFuture and virtual threads — plus the classic concurrency problems interviewers ask.
    modules:
      - {id: B1, title: "Threads: lifecycle, creation, interruption", level: 2, minutes: 25, prerequisites: []}
      - {id: B2, title: "Locks: synchronized, ReentrantLock, deadlock", level: 3, minutes: 25, prerequisites: [B1, A6]}
      - {id: B3, title: "Atomics, CAS and concurrent collections", level: 3, minutes: 25, prerequisites: [B2]}
      - {id: B4, title: "Executors and sizing thread pools", level: 3, minutes: 25, prerequisites: [B2]}
      - {id: B5, title: "CompletableFuture and async composition", level: 3, minutes: 25, prerequisites: [B4]}
      - {id: B6, title: "Virtual threads and structured concurrency", level: 3, minutes: 25, prerequisites: [B4]}
      - {id: B7, title: "Classic problems: producer-consumer, bounded queue, concurrent LRU, rate limiter", level: 4, minutes: 30, prerequisites: [B3, B4]}

  - id: C
    title: Time & Memory on Coding Problems
    code: DSA-CPLX
    description: Read the constraints, know where time and memory really go in Java, and optimise out loud.
    modules:
      - {id: C1, title: "From constraints to the expected complexity", level: 1, minutes: 20, prerequisites: []}
      - {id: C3, title: "Hidden time costs", level: 2, minutes: 20, prerequisites: [C1]}
      - {id: C2, title: "Where memory goes in Java solutions", level: 2, minutes: 25, prerequisites: [C1]}
      - {id: C4, title: "The optimisation playbook: brute force to optimal, out loud", level: 3, minutes: 25, prerequisites: [C2, C3]}
      - {id: C5, title: "Amortised analysis", level: 3, minutes: 20, prerequisites: [C1]}

  - id: D
    title: Spring & Spring Boot
    code: SPRING-BOOT
    description: From writing your own DI container to extending Spring and shipping a feature with confidence.
    modules:
      - {id: D1, title: "Build your own DI container", level: 2, minutes: 30, prerequisites: []}
      - {id: D2, title: "Spring core: IoC container, scopes, profiles", level: 2, minutes: 25, prerequisites: [D1]}
      - {id: D3, title: "Spring AOP and the proxy traps", level: 3, minutes: 25, prerequisites: [D2]}
      - {id: D4, title: "Spring Boot internals: auto-configuration and starters", level: 2, minutes: 25, prerequisites: [D2]}
      - {id: D11, title: "Spring Boot annotations, grouped by job", level: 2, minutes: 25, prerequisites: [D4]}
      - {id: D5, title: "Spring MVC: the request pipeline", level: 2, minutes: 25, prerequisites: [D4]}
      - {id: D6, title: "Data: JPA, Hibernate and @Transactional", level: 3, minutes: 30, prerequisites: [D3]}
      - {id: D12, title: "Testing Spring Boot: JUnit 5, Mockito, test slices, Testcontainers", level: 3, minutes: 30, prerequisites: [D6]}
      - {id: D7, title: "Spring Security: filter chain and JWT", level: 3, minutes: 25, prerequisites: [D5]}
      - {id: D13, title: "OAuth2 and OpenID Connect: delegated login done right", level: 4, minutes: 25, prerequisites: [D7]}
      - {id: D8, title: "Production readiness: Actuator, metrics, testing", level: 3, minutes: 25, prerequisites: [D5]}
      - {id: D9, title: "Extending Spring: post-processors, custom starters", level: 4, minutes: 30, prerequisites: [D4]}
      - {id: D10, title: "Shipping a feature: the playbook", level: 4, minutes: 25, prerequisites: [D6, D8]}

  - id: W
    title: Web & APIs
    code: WEB-API
    description: What actually travels between a client and your service — HTTP in depth, designing REST APIs people can rely on, and how services talk to each other.
    modules:
      - {id: W1, title: "HTTP in depth: methods, status codes, headers, caching, HTTPS/TLS", level: 2, minutes: 25, prerequisites: [S0]}
      - {id: W4, title: "Sockets and TCP in Java: from ServerSocket to NIO and WebSockets", level: 2, minutes: 30, prerequisites: [W1, J8, B1]}
      - {id: W2, title: "REST API design: resources, idempotency, versioning, pagination, errors", level: 3, minutes: 25, prerequisites: [W1, D5]}
      - {id: W5, title: "Web application security: OWASP Top 10, password storage, secrets and TLS", level: 3, minutes: 30, prerequisites: [W2, D7]}
      - {id: W3, title: "Microservice communication: API gateway, service discovery, REST vs gRPC vs events", level: 4, minutes: 25, prerequisites: [W2, S8]}

  - id: E
    title: SOLID → Design Patterns → LLD
    code: LLD-DESIGN
    description: Principles, the patterns they lead to (and where Spring and the JDK use them), and a method for low-level design rounds.
    modules:
      - {id: E1, title: "SOLID, by violation and refactor", level: 2, minutes: 30, prerequisites: []}
      - {id: E2, title: "Creational patterns", level: 3, minutes: 25, prerequisites: [E1]}
      - {id: E3, title: "Structural patterns", level: 3, minutes: 25, prerequisites: [E1]}
      - {id: E4, title: "Behavioural patterns", level: 3, minutes: 30, prerequisites: [E1]}
      - {id: E5, title: "The LLD interview method", level: 4, minutes: 25, prerequisites: [E2, E3, E4]}
      - {id: E6, title: "LLD case studies: parking lot, LRU cache, rate limiter, notification system", level: 4, minutes: 30, prerequisites: [E5]}
      - {id: E7, title: "DDD and hexagonal architecture: bounded contexts, aggregates, ports and adapters", level: 4, minutes: 35, prerequisites: [E5, S8]}

  - id: F
    title: HLD & System Design
    code: SYS-DES
    description: Building blocks, distributed-systems theory, a repeatable method, and the case studies interviewers ask.
    modules:
      - {id: F1, title: "Building blocks: load balancers, caches, queues, databases", level: 4, minutes: 30, prerequisites: []}
      - {id: F3, title: "The system design method and estimation", level: 4, minutes: 25, prerequisites: [F1]}
      - {id: F2, title: "Distributed theory: CAP, consistency, consensus", level: 5, minutes: 30, prerequisites: [F1]}
      - {id: F4, title: "Case studies: URL shortener, rate limiter, notification system", level: 4, minutes: 30, prerequisites: [F3]}
      - {id: F7, title: "DAGs: workflow orchestration and schedulers", level: 5, minutes: 25, prerequisites: [F3]}
      - {id: F6, title: "Case studies: distributed cache, metrics & monitoring", level: 5, minutes: 30, prerequisites: [F4]}
      - {id: F5, title: "Case studies: chat, news feed, collaborative editor", level: 5, minutes: 30, prerequisites: [F4, F2]}
      - {id: F8, title: "Case study: design a sports betting platform", level: 5, minutes: 35, prerequisites: [F4, Q8]}
      - {id: F9, title: "Multi-tenant SaaS design: isolation models, row-level security, noisy neighbours", level: 5, minutes: 35, prerequisites: [F3, Q6, Q8]}

  - id: I
    title: Distributed Building Blocks
    code: DIST-SYS
    description: The infrastructure every senior backend engineer is expected to run and reason about — Kafka, Redis, resilience patterns, containers and Kubernetes.
    modules:
      - {id: I2, title: "Redis in depth: data types, TTL, eviction, persistence, distributed locks", level: 3, minutes: 25, prerequisites: [F1]}
      - {id: I1, title: "Kafka in depth: partitions, consumer groups, offsets, delivery guarantees", level: 4, minutes: 30, prerequisites: [F1]}
      - {id: I3, title: "Resilience patterns: timeouts, retries, circuit breaker, bulkhead, saga, outbox", level: 4, minutes: 30, prerequisites: [S8]}
      - {id: I5, title: "Linux and the OS for backend engineers: processes, memory, files, the commands", level: 3, minutes: 30, prerequisites: [B1, W4]}
      - {id: I4, title: "Docker and Kubernetes for a backend engineer", level: 3, minutes: 30, prerequisites: [S8]}
      - {id: I6, title: "Git, CI/CD and safe deployments: branching, pipelines, blue-green, canary, flags", level: 3, minutes: 25, prerequisites: [I4]}
      - {id: I7, title: "Observability in production: logs, metrics, traces, Grafana, SLOs", level: 4, minutes: 30, prerequisites: [D8, I6]}
      - {id: I8, title: "Cloud for backend engineers: AWS core services and the Azure map", level: 4, minutes: 30, prerequisites: [F1, I4]}
      - {id: I9, title: "Batch and stream processing: Spring Batch, OLTP vs OLAP, Kafka Streams, Flink", level: 4, minutes: 35, prerequisites: [I1, F7]}

  - id: G
    title: AI Engineering
    code: AI-ENG
    description: Using LLMs in real systems — models, RAG, MCP, agents and DAG workflows, evals and safety, in Java.
    modules:
      - {id: G1, title: "How LLMs work, enough to reason about them", level: 3, minutes: 25, prerequisites: []}
      - {id: G2, title: "Using the models: prompting, structured output, tools, caching", level: 3, minutes: 30, prerequisites: [G1]}
      - {id: G3, title: "RAG: retrieval-augmented generation", level: 4, minutes: 30, prerequisites: [G2]}
      - {id: G4, title: "MCP: the Model Context Protocol", level: 4, minutes: 25, prerequisites: [G2]}
      - {id: G5, title: "Agents and DAG workflows", level: 4, minutes: 25, prerequisites: [G2]}
      - {id: G6, title: "Evals and safety", level: 5, minutes: 25, prerequisites: [G3]}
      - {id: G7, title: "Spring AI and the Claude Java SDK", level: 4, minutes: 25, prerequisites: [G2, D4]}

  - id: Q
    title: Databases & SQL
    code: DB-SQL
    description: From your first JOIN to window functions, indexes, query plans, transactions and scaling a database — what SQL and database-performance rounds actually test.
    modules:
      - {id: Q1, title: "Relational model and SQL basics: SELECT and JOINs", level: 2, minutes: 25, prerequisites: []}
      - {id: Q2, title: "Aggregation, GROUP BY, subqueries and CTEs", level: 2, minutes: 25, prerequisites: [Q1]}
      - {id: Q10, title: "Data modeling: keys, relationships, normalization and when to denormalize", level: 2, minutes: 25, prerequisites: [Q2]}
      - {id: Q3, title: "Window functions", level: 3, minutes: 25, prerequisites: [Q2]}
      - {id: Q9, title: "JDBC: connections, PreparedStatement, transactions and HikariCP", level: 2, minutes: 25, prerequisites: [Q1, J4]}
      - {id: Q5, title: "Indexes and reading EXPLAIN", level: 3, minutes: 30, prerequisites: [Q2]}
      - {id: Q6, title: "Transactions, isolation, locking and MVCC", level: 3, minutes: 30, prerequisites: [Q5]}
      - {id: Q7, title: "Query performance in practice: N+1, pagination, batching, pooling", level: 3, minutes: 25, prerequisites: [Q5, Q6]}
      - {id: Q4, title: "SQL interview patterns: top-N per group, gaps and islands, running totals", level: 3, minutes: 30, prerequisites: [Q3]}
      - {id: Q8, title: "Scaling databases: replicas, partitioning, sharding, caching, CQRS", level: 4, minutes: 30, prerequisites: [Q7, F1]}
      - {id: Q11, title: "NoSQL: key-value, document, wide-column, search; choosing a database", level: 4, minutes: 30, prerequisites: [Q8]}

  - id: L
    title: Lifecycles
    code: LIFECYCLE
    description: Step-by-step lifecycles with the gotcha at each stage — the "explain how X works" questions.
    modules:
      - {id: L1, title: "Java program and class lifecycle", level: 1, minutes: 20, prerequisites: [A1]}
      - {id: L3, title: "Thread lifecycle", level: 2, minutes: 20, prerequisites: [B1]}
      - {id: L4, title: "Spring bean lifecycle", level: 2, minutes: 25, prerequisites: [D2]}
      - {id: L5, title: "Spring Boot startup", level: 2, minutes: 20, prerequisites: [D4]}
      - {id: L6, title: "HTTP request lifecycle in Spring MVC", level: 2, minutes: 20, prerequisites: [D5]}
      - {id: L7, title: "JPA entity and transaction lifecycle", level: 3, minutes: 25, prerequisites: [D6]}
      - {id: L2, title: "Object and GC lifecycle", level: 3, minutes: 20, prerequisites: [A4]}

  - id: H
    title: Tips & Tricks
    code: INTV-TIPS
    description: Small things that save interviews and production incidents.
    modules:
      - {id: H1, title: "Java idioms for coding interviews", level: 1, minutes: 20, prerequisites: []}
      - {id: H2, title: "Interview technique: think aloud, test, recover", level: 1, minutes: 20, prerequisites: []}
      - {id: H3, title: "Debugging and production habits", level: 2, minutes: 20, prerequisites: []}
      - {id: H4, title: "System design interview kit: method, numbers, patterns, practice", level: 4, minutes: 30, prerequisites: [F1, F3]}

  - id: K
    title: "Capstone: TicketHub"
    code: CAPSTONE
    description: One Spring Boot service you grow every weekend, in your own repo — an event-ticket booking API with seat locking, caching, Kafka events, security and Docker. Each milestone uses only what the lessons have taught so far. Spec in docs/CAPSTONE.md.
    modules:
      - {id: K1, title: "Domain model in plain Java, with tests", level: 2, minutes: 60, prerequisites: [J4]}
      - {id: K2, title: "In-memory booking engine: collections, streams, thread-safe holds, JSON seed", level: 2, minutes: 60, prerequisites: [K1, J7, J8, B1]}
      - {id: K3, title: "Spring Boot skeleton: DI, configuration, profiles, read-only endpoints", level: 3, minutes: 60, prerequisites: [K2, D2]}
      - {id: K4, title: "REST API done properly: validation, problem details, idempotency key, pagination", level: 3, minutes: 60, prerequisites: [K3, W2]}
      - {id: K5, title: "PostgreSQL with Flyway and JPA; optimistic locking on seats", level: 3, minutes: 60, prerequisites: [K4, D6, Q6]}
      - {id: K6, title: "Tests that prove it: slices, Testcontainers, the double-booking race, N+1 fix", level: 3, minutes: 60, prerequisites: [K5, D12]}
      - {id: K7, title: "Hold expiry job and pricing strategies", level: 3, minutes: 60, prerequisites: [K6, B4, E4]}
      - {id: K8, title: "Security: JWT resource server, roles, ownership checks; virtual threads", level: 4, minutes: 60, prerequisites: [K7, D7, B6]}
      - {id: K9, title: "Redis: cached event pages and seat map, hold TTL; Actuator health and metrics", level: 4, minutes: 60, prerequisites: [K8, I2, D8]}
      - {id: K10, title: "Kafka via the transactional outbox; idempotent consumer; Resilience4j on payments", level: 4, minutes: 60, prerequisites: [K9, I1, I3]}
      - {id: K11, title: "Ship it: Dockerfile, Compose for the whole stack, Kubernetes manifests with probes", level: 4, minutes: 60, prerequisites: [K10, I4]}
      - {id: K12, title: "Polish and tell it: README and diagram, a load test, the STAR story, a 5-minute demo", level: 5, minutes: 60, prerequisites: [K11]}

paths:
  - id: zero-to-pro
    title: Zero to Pro (start here)
    description: One gentle route through everything — each module only uses what earlier ones taught. Levels rise from 1 (Explorer) to 5 (Architect).
    modules: [S0, J1, A1, L1, J2, J3, C1, H1, J4, J5, J6, A2, C3, C2, J7, E1, B1, L3, J8, W1, W4, S1, S2, S3, D1, S4, S5, D2, L4, D3, S6, S7, D4, L5, D11, D5, W2, Q1, Q2, Q10, Q3, Q9, L6, D6, Q5, Q6, Q7, Q4, L7, D12, A7, A3, A4, L2, A6, B2, B3, B4, C4, C5, H2, E2, E3, E4, E5, E6, B5, B6, B7, D7, D13, W5, D8, H3, F1, I2, I1, Q8, Q11, F3, H4, S7B, S8, W3, I3, I5, I4, I6, I7, I8, F2, F4, S9, F7, F6, F5, F8, S10, S11, A5, A8, D9, D10, G1, G2, G3, G4, G5, G6, G7, S12, S13]
  - id: entain
    title: Entain interview path
    description: For the 13 Oct Entain SDE II round — HR named system design, database performance and scalability, and SQL. SQL first, then database internals, then betting-domain design.
    modules: [Q1, Q2, Q3, Q4, Q5, Q6, Q7, F1, Q8, F3, H4, F2, S9, F6, F8]
  - id: microsoft
    title: Microsoft interview path
    description: The modules that pay off most for the Microsoft loop (DSA, LLD, HLD, Senior-level Java concurrency), in study order.
    modules: [H2, C1, C3, C2, C4, H1, E1, E5, E6, B1, B2, B4, B7, F1, F3, F4, F6, F5, F2, A6, A2, A4]
  - id: system-design
    title: System design path
    description: General system design prep, not tied to one company. The building blocks and the method, then the interview kit, then theory and scaling, then the case studies. Pair it with the kit's practice ladder of bank problems.
    modules: [H2, F1, I2, I1, F3, H4, F2, Q8, S9, I3, F4, F5, F6, F7, F8]
  - id: backend-from-scratch
    title: Backend from scratch
    description: The full story, start to finish — why each technology exists, then how it works.
    modules: [S0, W1, S1, S2, S3, S4, S5, D1, S6, S7, D2, D3, D4, D5, D6, S7B, S8, S9, S10, S11, S12, S13]
  - id: going-further
    title: Going further
    description: Extra depth outside the dated plan. Read these any time after their prerequisites.
    modules: [E7, F9, I9]
  - id: capstone
    title: "Capstone: TicketHub"
    description: The weekend build, milestone by milestone. One hour each Sunday; your repo, your commits, your interview story.
    modules: [K1, K2, K3, K4, K5, K6, K7, K8, K9, K10, K11, K12]
