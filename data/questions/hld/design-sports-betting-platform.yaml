prompt: |
  Design a sports betting platform: users see live odds, place bets, and get paid out when a
  match ends. Focus on bet placement, the wallet, and settlement under big-match traffic spikes.
follow_ups:
- A user has 100 in the wallet and places two 100 bets at the same time from two devices. What stops both going through?
- The client retries a bet after a timeout. How do you make sure it is charged only once?
- The odds changed between the user seeing them and the bet reaching the server. What happens?
- A match ends and 200k bets must be settled. How, and what if the job crashes halfway?
- Where is stale data acceptable, and where is it not?
