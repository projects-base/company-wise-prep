slug: design-flash-giveaway-free-burgers
title: Design a flash sale that gives away 6 million burgers in 10 minutes
type: HLD
difficulty: hard
tags:
- flash-sale
- inventory
- rate-limiting
- queue
- idempotency
- high-throughput
- burst-traffic
- observability
prompt: |
  Design a system for a campaign in which 6 million burgers are claimed within 10 minutes (one per user), without overselling and with every burger claimed.
follow_ups:
- How do you throttle traffic?
- How do you lock inventory so that nothing is oversold?
- How do you queue orders and handle failures under eventual consistency?
- How do you make sure all 6 million are claimed within the 10 minutes?
- Which monitoring, logging and failover do you add?
- How would you test it?
- What are the potential bottlenecks and failures, and how will you address them?
- Cover the trade-offs you made and why.
- How will you track the number of vouchers?
- What will you do if a user tries to claim a voucher again?
- What do you do before going live to ensure the system works?
- 'The system is live: how do you ensure it works properly and services are healthy?'
- Negotiate requirements such as multi-region support.
- Fairness of distribution.
academy:
- H4
- I2
- I1
- Q6
