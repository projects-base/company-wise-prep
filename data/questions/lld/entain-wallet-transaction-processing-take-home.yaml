prompt: |
  Build an HTTP service (Go + PostgreSQL, Docker) that receives POST requests from third-party providers with {state: win|lose, amount, transactionId} and a Source-Type header (game|server|payment); win increases and lose decreases the user's balance.
follow_ups:
- Each transactionId must be processed only once (idempotency)
- 'The account balance can never go negative: how do you guarantee that under concurrent requests (row
  locks / SELECT ... FOR UPDATE / constraints)?'
- 'Post-processing: every N minutes cancel the 10 latest odd records and correct the balance; cancelled
  records must not be processed again'
- How do you store money (decimal vs integer minor units)?
- Schema design for users and transactions tables, migrations and indexes
