id: deliveroo-2026-11
name: Deliveroo Software Engineer II, Hyderabad
role: Software Engineer II, backend (Deliveroo, Hyderabad)
companies:
  deliveroo: 1.0
start: 2026-11-25
interview: 2026-12-10        # PLACEHOLDER: no test or interview date known yet (referral stage, 2026-11-24)
minutes:
  weekday: 40
  weekend: 60
review_days: 1
notes: >-
  Referral stage: the interview date above is a placeholder, so treat the dates as a 15-day order of work and move
  them when a real date arrives. Deliveroo's public board had no open SE II in Hyderabad on 24 Nov 2026, so first ask the
  referrer for the job link, whether it is on the Deliveroo or the DoorDash board, and whether AI is allowed in the coding
  round. This is a separate campaign. On these days do only the 25-minute floor of the 23-week plan and keep the weekend
  Masai classes.
guide: |
  ## How this kit works

  - **Order of work:** HackerRank first, then the take-home, then architecture, then behavioural. That is the order of the loop.
  - **Write your own cron parser.** Deliveroo rejects AI-written submissions and bans AI in live rounds, so read the model answer only after your own version runs.
  - **Placeholder date:** 10 Dec. When you get a real one, tell Claude and the plan moves.
  - **Repeat sessions** (the cron drills, the mock, the final review) have no question attached on purpose, so marking a question done never ticks them. Tick them by hand.
  - **Stretch sessions** are optional; the core ones are the kit.

  ## Ask your referrer first

  - The job link or ID, and which board it is on (Deliveroo or DoorDash India).
  - Which interview process applies, and whether AI is allowed in the coding round.
  - Take-home or live coding, and any deadline.
