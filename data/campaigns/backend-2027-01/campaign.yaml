guide: |
  ## The goal

  Restarted on **Mon 23 Nov 2026**. By **mid-January** you are interview-ready on what most loops ask first (Java,
  Spring Boot, SQL and JPA, testing, the system design kit and 8 DSA patterns) and start applying, because January to
  March is when the new hiring budgets open. The AI lessons follow straight after, and the **AI Build** project
  (TriageDesk, docs/AI-PROJECT.md) gives you hands-on LLM, RAG, MCP, agent, Kafka, observability and Terraform
  experience you can defend in an interview. By **Thu 08 Apr 2027** you have done all 119 lessons on the Zero to Pro path
  and all 10 AI Build milestones while the interviews are running.

  Weekends belong to the **Masai AI-ML course**, so this plan lives on weekdays: about 5 hours a week of core, plus one
  design on Sunday.

  ## Your week

  | Day | Core (the plan) | Floor (bad day) | Stretch (good day) |
  |---|---|---|---|
  | **Mon** | 2 scratch lessons (60), or one **AI Build** milestone (60) when one is due | the first lesson / the milestone's first 30 min | a DSA problem |
  | **Tue** | Lesson 30 + DSA 30 | the lesson | Say it out loud |
  | **Wed** | Same as Monday; weeks 1–3 also a Masai backlog session (45) | the first lesson / the milestone's first 30 min | a DSA problem |
  | **Thu** | Lesson 30 + DSA 30 | the lesson | Say it out loud |
  | **Fri** | Lesson 30 + DSA 30 | the lesson | Say it out loud |
  | **Sat** | **Masai:** live class and assignment | Masai | Catch-up slot (30), only if a weekday session is unfinished |
  | **Sun** | **Masai** + one design or mock (60) + weekly review (15) | the review | one more design |

  The Today page shows core first, stretch below it, and a **Short on time? Do just this** button for the floor.

  ## The daily routine

  - **Pick one fixed weekday slot** (for example 7:00–8:00 before work, or 21:00–22:00) and protect it. Same slot,
    every weekday.
  - **Sunday:** after the Masai class, the design hour, then the 15-minute review. Saturday is Masai only.
  - **Masai backlog:** weeks 1–3 add one weekday evening (Wednesday) for a missed lecture or pending assignment. Clear
    it early so the weekends are just the class and that week's assignment.
  - **AI Build:** a milestone lands on the first Monday or Wednesday after the lessons it needs. Build it in your own
    `triagedesk` repo, commit and tag it; that repo is the evidence behind "tell me about something you built".

  ## The 7 rules

  1. **Same slot every weekday.** Start the first core step within a minute of sitting down.
  2. **Never a zero day.** On a terrible day, do the floor: just the lesson. That keeps the streak.
  3. **Missing a day is normal, not a disaster.** Saturday's catch-up slot takes the most important unfinished
     session (an AI Build milestone, then DSA, then a lesson). Anything still unfinished on Sunday night is dropped,
     not carried. Never double up on Monday, and never add more than 30 extra minutes to a day.
  4. **Recall before reading.** Attempt every problem for 22 minutes and answer every question out loud *before*
     opening the model answer.
  5. **Every concept answer in 4 layers:** what it is → how it works inside → where you used it → what goes wrong.
  6. **Out loud, not in your head.** Interviews are spoken. Use Judge my answer (speak or Record).
  7. **Every mock is scored and logged.** Four mocks with Claude (weeks 9, 10, 13 and 14) and two finals on the last
     two Sundays. Below 6/10 means that topic goes first the next week.

  Stuck on a page? Use **Stuck?** (the Lifeline): nudge first, key idea next, full explanation last.

  ## The 20-week map

  The lessons run the Academy's *Zero to Pro* path in order, except that the system design kit (SYS-DES-1, SYS-DES-2,
  INTV-TIPS-4), interview technique (INTV-TIPS-2), the glossary (REFERENCE-1) and the AI lessons (AI-ENG-1 to 7) come
  right after testing, so the kit is done before the applications start and the AI Build can begin. The other
  reference pages sit next to the lessons they summarise: the pattern catalog (REFERENCE-2) after the patterns, the
  architecture styles (REFERENCE-3) after DDD and hexagonal, and the tools map (REFERENCE-4) after Terraform. Weeks
  1–12 take one DSA pattern each; later weeks are interview-level problems, timed.

  | Week | Dates | Lessons (steps: first … last) | AI Build | DSA | Sunday design |
  |---|---|---|---|---|---|
  | 1 | 23 Nov – 29 Nov | 1–7: BE-STORY-1 … DSA-CPLX-1 | — | Arrays, hashing, two pointers | LLD · Design a (Multi-level) Parking Lot |
  | 2 | 30 Nov – 06 Dec | 8–14: INTV-TIPS-1 … DSA-CPLX-3 | — | Sliding window, prefix sums | HLD · Design a URL Shortener |
  | 3 | 07 Dec – 13 Dec | 15–21: JAVA-FUND-7 … WEB-API-2 | — | Stacks, binary search | LLD · Design a Vending Machine |
  | 4 | 14 Dec – 20 Dec | 22–28: BE-STORY-2 … SPRING-BOOT-2 | — | Linked lists, intervals | HLD · Design a Distributed Unique ID Generator |
  | 5 | 21 Dec – 27 Dec | 29–35: LIFECYCLE-3 … LIFECYCLE-4 | — | Trees | LLD · Design a Multi-module Logging Framework |
  | 6 | 28 Dec – 03 Jan | 36–42: SPRING-BOOT-5 … DB-SQL-4 | — | Heaps, top-K | HLD · Design an Idempotent API |
  | 7 | 04 Jan – 10 Jan | 43–49: DB-SQL-5 … DB-SQL-9 | — | Graphs: BFS and DFS | LLD · Cache Service with Pluggable Eviction |
  | 8 | 11 Jan – 17 Jan | 50–56: LIFECYCLE-6 … REFERENCE-1 | — | Graphs: topological sort, union-find, shortest paths | HLD · Design a Ticket Booking System |
  | 9 | 18 Jan – 24 Jan | 57–61: AI-ENG-1 … AI-ENG-4 | AI-BUILD-1 | Backtracking, tries | LLD mock with Claude |
  | 10 | 25 Jan – 31 Jan | 62–64: AI-ENG-5 … JAVA-JVM-3 | AI-BUILD-2, AI-BUILD-3 | Dynamic programming 1 | System design mock with Claude |
  | 11 | 01 Feb – 07 Feb | 65–67: JAVA-JVM-4 … LIFECYCLE-7 | AI-BUILD-4, AI-BUILD-5 | Dynamic programming 2, greedy | LLD · Design a Rate Limiter |
  | 12 | 08 Feb – 14 Feb | 68–70: JAVA-JVM-6 … JAVA-CONC-3 | AI-BUILD-6, AI-BUILD-7 | Design data structures | HLD · Design Microsoft Teams Messaging |
  | 13 | 15 Feb – 21 Feb | 71–77: JAVA-CONC-4 … REFERENCE-2 | — | Hard mixed, timed | LLD mock with Claude |
  | 14 | 22 Feb – 28 Feb | 78–84: LLD-DESIGN-5 … SPRING-BOOT-10 | — | Hard mixed, timed | System design mock with Claude |
  | 15 | 01 Mar – 07 Mar | 85–91: WEB-API-4 … DB-SQL-11 | — | Hard mixed, timed | LLD · Design a Notification System |
  | 16 | 08 Mar – 14 Mar | 92–98: BE-STORY-9 … DIST-SYS-4 | — | Hard mixed, timed | HLD · Design a Payment Service |
  | 17 | 15 Mar – 21 Mar | 99–103: DIST-SYS-5 … DIST-SYS-11 | AI-BUILD-8 | Hard mixed, timed (re-solve) | LLD · Design an Elevator System |
  | 18 | 22 Mar – 28 Mar | 104–106: REFERENCE-4 … SYS-DES-4 | AI-BUILD-9, AI-BUILD-10 | Hard mixed, timed (re-solve) | HLD · Design a distributed queue with multiple producers and consumers |
  | 19 | 29 Mar – 04 Apr | 107–113: BE-STORY-11 … BE-STORY-13 | — | Hard mixed, timed (re-solve) | Final LLD mock with Claude |
  | 20 | 05 Apr – 11 Apr | 114–119: JAVA-JVM-7 … BE-STORY-15 | — | Hard mixed, timed (re-solve) | Final system design mock with Claude |

  ## Applications (from week 8)

  - **Sun 17 Jan checkpoint:** resume updated with impact numbers, then start applying. Line up referrals in early
    January; a referral from a senior or long-tenured engineer works best.
  - Aim for 30–60 target companies across product companies, fintech, healthcare platforms and GCCs, and for two
    offers at the same time. Target SDE II / Senior; do not accept a lower level.
  - Only put on your resume what you can defend in depth. As each AI Build milestone lands, it becomes a project line
    you can talk about.
  - After each real interview, its questions go into that Sunday's review, and any topic you could not answer goes
    first the next week.

  ## When you fall behind

  - **A missed day:** Saturday's catch-up slot (rule 3).
  - **A whole week lost** (illness, release crunch, holidays): do floors only that week, skip its Sunday design, and
    restart on the following Monday's plan.
  - **Two weekly reviews with gaps in a row:** stop stretch for a week and spend that time on the gaps.

  ## Done means

  All 119 Zero to Pro lessons, all 10 AI Build milestones in your repo, 59 DSA problems solved
  alone (more with stretch), the Sunday designs, 6 mocks logged with the last three at 7/10 or better, and the
  behavioural stories rehearsed before the applications start.
